# ingredi 그로스 운영 자동화 (2026-10-13)
# - 04:30 KST: ops-collect (어제 데이터 API 수집 → Airtable)
# - 05:40 KST, 08:10~22:10 KST 매시: ops-act (광고_실행요청 실행)
# 비밀값 OPS_SECRET은 GitHub 저장소 Secrets와 Cloudflare Pages 환경변수에 같은 값으로 둔다.
name: ingredi-ops
on:
  schedule:
    - cron: '30 19 * * *'        # 04:30 KST  collect
    - cron: '40 20 * * *'        # 05:40 KST  act
    - cron: '10 23,0-13 * * *'   # 08:10~22:10 KST 매시 act
  workflow_dispatch:
    inputs:
      job:
        description: 'collect 또는 act'
        default: 'collect'
      date:
        description: '수집 날짜 YYYY-MM-DD (비우면 어제)'
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: call
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          JOB: ${{ github.event.inputs.job }}
          DATE: ${{ github.event.inputs.date }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHED" = "30 19 * * *" ]; then JOB=collect; else JOB=act; fi
          fi
          if [ "$JOB" = "collect" ]; then URL="https://ingredi.kr/ops-collect?key=${OPS_SECRET}&date=${DATE}"; else URL="https://ingredi.kr/ops-act?key=${OPS_SECRET}"; fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 280 "$URL")
          echo "HTTP $code"; head -c 3000 out.json | sed 's/"key=[^"]*"//g'; echo
          python3 -c "import json,sys; d=json.load(open('out.json')); sys.exit(0 if d.get('ok') else 1)"
