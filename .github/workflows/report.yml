# 점검 PDF 보관·파트너 메일 (2026-10-14)
# 07시 보고 세션이 ops/report/seal.sh로 암호화한 PDF·메일을 reports 브랜치에 올린 뒤 이 워크플로를 date 입력으로 실행한다.
# → Drive 'Ingredi/마케팅/Daily Report'에 PDF 업로드(md5 확인) + Gmail 발송(PDF 첨부).
# 필요한 Secrets: REPORT_PRIVATE_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN (ops/report/deliver.py 참고)
name: report-deliver
on:
  workflow_dispatch:
    inputs:
      date:
        description: '보고일 YYYY-MM-DD (reports/<date>/)'
        required: true
      skip_mail:
        description: '1이면 Drive 업로드만'
        default: '0'
concurrency:
  group: report-${{ github.event.inputs.date }}
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops/report
      - name: fetch sealed report
        run: |
          git fetch --depth=1 origin reports
          git checkout origin/reports -- "reports/${{ github.event.inputs.date }}"
      - name: deliver
        env:
          DATE: ${{ github.event.inputs.date }}
          SKIP_MAIL: ${{ github.event.inputs.skip_mail }}
          REPORT_PRIVATE_KEY: ${{ secrets.REPORT_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 ops/report/deliver.py
