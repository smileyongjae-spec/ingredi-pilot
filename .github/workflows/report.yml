# 점검 PDF 보관·파트너 메일 (2026-10-14)
# 07시 보고 세션이 ops/report/seal.sh로 암호화한 PDF·메일을 reports 브랜치에 push하면 자동 실행된다.
#   (seal.sh가 이 파일을 reports 브랜치에도 함께 넣는다. push 이벤트는 push된 커밋의 워크플로 파일을 쓰기 때문)
# → Drive 'Ingredi/마케팅/Daily Report'에 PDF 업로드(md5 확인) + Gmail 발송(PDF 첨부).
# 같은 날짜 PDF가 이미 Drive에 있으면 메일은 다시 보내지 않는다(force_mail=1이면 보냄).
# 필요한 Secrets: REPORT_PRIVATE_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN (ops/report/deliver.py 참고)
name: report-deliver
on:
  push:
    branches: [reports]
    paths: ['reports/**']
  workflow_dispatch:
    inputs:
      date:
        description: '보고일 YYYY-MM-DD (reports/<date>/)'
        required: true
      skip_mail:
        description: '1이면 Drive 업로드만'
        default: '0'
      force_mail:
        description: '1이면 Drive에 이미 있어도 메일 발송'
        default: '0'
concurrency:
  group: report-deliver
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          sparse-checkout: ops/report
      - name: data (reports)
        uses: actions/checkout@v4
        with:
          ref: reports
          path: data
          sparse-checkout: reports
      - name: date
        id: d
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          D="$IN_DATE"
          if [ -z "$D" ]; then D=$(printf '%s' "$MSG" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"; echo "DATE=$D"
      - name: deliver
        working-directory: data
        env:
          DATE: ${{ steps.d.outputs.date }}
          SKIP_MAIL: ${{ github.event.inputs.skip_mail }}
          FORCE_MAIL: ${{ github.event.inputs.force_mail }}
          REPORT_PRIVATE_KEY: ${{ secrets.REPORT_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 ../code/ops/report/deliver.py
