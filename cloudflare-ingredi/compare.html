<style>

    /* ── 공유 버튼 ── */
    .header-share { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); background: none; border: none; border-radius: 8px; padding: 0; }

    .share-toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--green-deep); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 100px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }

  .pc-rm{display:block;width:100%;margin-top:7px;padding:5px;background:var(--green-light);color:var(--green-deep);border:none;border-radius:7px;font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer}
  .rlabel{position:sticky;left:0;background:var(--paper);z-index:2;font-size:11px;color:var(--ink-faint);font-weight:600;padding:11px 4px 11px 2px;border-top:1px solid var(--line-soft);line-height:1.25}
  .rcell{padding:11px 4px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
  .rcell .v{font-weight:700;color:var(--green-deep)}
  .rcell.best .v{color:var(--green-primary)}
  .best-dot{display:inline-block;font-size:10px;color:var(--green-primary);margin-left:3px;vertical-align:middle}
  .rcell .unit{font-size:11px;color:var(--ink-faint);font-weight:500}
  .cmp-basis{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:11.5px;color:var(--ink-faint)}
  .cmp-basis b{font-weight:700;color:var(--green-primary);background:var(--green-light);padding:2px 8px;border-radius:20px;font-size:11px}
  .buyrow{display:flex;gap:8px;margin-top:14px}
  .buy{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 8px;border-radius:10px;text-decoration:none;background:var(--green-primary);color:#fff;box-shadow:0 3px 10px rgba(45,95,63,.24)}
  .buy:active{transform:scale(.99)}

  footer{padding:24px 4px 40px;font-size:11px;color:var(--ink-faint);line-height:1.6;text-align:center}

<script>
const API = window.location.origin + "/recommend2";

function shareIngredi(){
  var url = location.origin + location.pathname;
  var data = { title: 'ingredi', text: 'AI가 상담하고 추천하는, 광고 없는 건강기능식품 비교 · ingredi', url: url };
  if (navigator.share) { navigator.share(data).catch(function(){}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(function(){ showShareToast('링크가 복사되었어요'); })
      .catch(function(){ window.prompt('아래 링크를 복사하세요', url); });
  } else { window.prompt('아래 링크를 복사하세요', url); }
}
window.shareIngredi = shareIngredi;
function showShareToast(msg){
  var t = document.getElementById('shareToast');
  if (!t) { t = document.createElement('div'); t.id = 'shareToast'; t.className = 'share-toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(t._shareTimer);
  t._shareTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
window.showShareToast = showShareToast;

// 백버튼 표준: 같은 사이트에서 왔으면 진짜 직전 화면, 직접 진입이면 폴백
function smartBack(fallback) {
  try {
    const ref = document.referrer;
    if (history.length > 1 && ref && new URL(ref).origin === location.origin) {
      history.back();
      return;
    }
  } catch (e) {}
  location.href = fallback || '/app.html';
}
window.smartBack = smartBack;
const CATS = [
  { key:"오메가3", label:"오메가3" }, { key:"눈", label:"눈 건강" },
  { key:"마이크로바이옴", label:"유산균" }, { key:"비타민C", label:"비타민C" }
];
const GRADE = {
  A:["#FBF3DD","#B8902F","#EBD9A8"], B:["#F0F0F2","#6E7177","#DADCE0"],
  C:["#EAF1EA","#2D5F3F","#CADBCD"], D:["#F6ECE3","#B07142","#E6D2C2"], E:["#F0EFEC","#8B8E91","#DEDCD6"]
};
function gradeFromScore(s){ s = parseFloat(s); if (isNaN(s)) s = 0; return s>=90?"A":s>=80?"B":s>=70?"C":s>=60?"D":"E"; }

/* ── app.html과 동일한 프로필 점수 엔진 (표시 점수·등급 일치용) ── */
const PROFILES = [
  { key:"balanced", label:"균형",   w:{core:0.50, cost:0.35, review:0.15} },
  { key:"premium",  label:"고품질", w:{core:0.70, cost:0.10, review:0.20} },
  { key:"budget",   label:"가성비", w:{core:0.25, cost:0.65, review:0.10} }
];
let activeProfile = "balanced";   // URL ?profile= 로 덮어씀. 미지정/미인식 → 균형
let activeSubKey = null;          // URL ?sub= (유산균 대상분류 / 비타민C 용량)
function profileLabel(){ const p = PROFILES.find(x=>x.key===activeProfile); return p ? p.label : "균형"; }

const SUBFILTERS = {
  "마이크로바이옴": ["일반","여성","키즈"],
  "비타민C": ["일반","메가도즈"]
};
function truthyStr(v){
  if (v===true) return true;
  if (typeof v==="number") return v>0;
  const t = String(v==null?"":v).trim().toLowerCase();
  return t!=="" && t!=="0" && t!=="false" && t!=="no" && t!=="없음" && t!=="x" && t!=="-";
}
function matchSub(cat, key, p){
  if (cat==="마이크로바이옴"){
    const t = String(p.target||"").trim() || "일반";
    return key==="일반" ? (t==="일반") : (t===key);
  }
  if (cat==="비타민C"){
    const mega = num(p.primaryValue) >= 2000;
    return key==="메가도즈" ? mega : !mega;
  }
  return true;
}
// 눈: 카로티노이드 합산 → 핵심성분점수 재계산 (app.html과 동일)
function applyEyeLogic(products){
  if (!products.length || products[0]._eyeDone) return;
  const AST = 2.5;
  const arr = products.map(function(p){
    const lut = num(p.primaryValue);
    const zea = num(p.extra && p.extra["지아잔틴_mg"]);
    const ast = num(p.extra && p.extra["아스타잔틴_mg"]);
    return { p:p, raw: lut+zea+ast, w: lut+zea+ast*AST };
  });
  const ws = arr.map(o=>o.w).filter(x=>x>0);
  const wmin = ws.length?Math.min.apply(null,ws):0, wmax = ws.length?Math.max.apply(null,ws):0;
  arr.forEach(function(o){
    o.p.primaryValue = o.raw;
    const base = (wmax>wmin) ? ((o.w-wmin)/(wmax-wmin))*90 : (o.w>0?90:0);
    const vitA = truthyStr(o.p.extra && o.p.extra["비타민A"]);
    const beta = num(o.p.extra && o.p.extra["베타카로틴_mg"])>0 || truthyStr(o.p.extra && o.p.extra["베타카로틴_mg"]);
    let core = base + (vitA?5:0) + (beta?3:0);
    if (core>100) core = 100;
    if (!o.p.scores) o.p.scores = {};
    o.p.scores.core = core;
    o.p._eyeDone = true;
  });
}
function scoreFor(p, w){
  const sc = p.scores || {};
  return w.core*num(sc.core) + w.cost*num(sc.cost) + w.review*num(sc.review);
}
// 기준별 순위 → 98~55 균등 분포 (app.html 로직 그대로)
function computeProfileScores(products){
  const N = products.length;
  PROFILES.forEach(function(pr){
    const ranked = products.map(function(p,i){
      const k = (pr.key==="balanced") ? num(p.vScore) : scoreFor(p, pr.w);
      return {p:p, i:i, k:k};
    });
    ranked.sort(function(a,b){ return (b.k - a.k) || (a.i - b.i); });
    ranked.forEach(function(o, idx){
      const score = (N<=1) ? 98 : Math.round(98 - idx*(98-55)/(N-1));
      if (!o.p._vs) o.p._vs = {};
      o.p._vs[pr.key] = score;
    });
  });
}
// 표시 점수: 모집단 밖 제품은 원본 V_Score로 폴백
function vsOf(p){
  return (p && p._vs && p._vs[activeProfile]!=null) ? p._vs[activeProfile] : Math.round(num(p.vScore));
}
// 카테고리 응답을 app.html과 같은 모집단 기준으로 준비하고, 화면에 쓸 목록을 돌려준다
function preparePopulation(data){
  const cat = data.category;
  const all = data.products || [];
  if (cat==="눈") applyEyeLogic(all);
  const subs = SUBFILTERS[cat];
  const useSub = subs && activeSubKey && subs.indexOf(activeSubKey)!==-1;
  const population = useSub ? all.filter(p=>matchSub(cat, activeSubKey, p)) : all;
  computeProfileScores(population);
  data._population = population;
  return population;
}
const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 58 58"><rect width="58" height="58" rx="13" fill="#EEF1EC"/><rect x="22" y="12" width="14" height="7" rx="2" fill="#9FB6A4"/><rect x="17" y="18" width="24" height="29" rx="6" fill="#2D5F3F"/><rect x="17" y="29" width="24" height="9" fill="#fff" opacity="0.9"/></svg>'
);
const MAX = 3;

const cache = {};
let activeCat = null;
let curData = null;          // 현재 카테고리 응답
let selected = [];           // 선택된 product id (현재 카테고리 한정)

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function fmt(n){ return Number(n).toLocaleString('ko-KR'); }
function gradeOf(p){ return GRADE[gradeFromScore(vsOf(p))] || GRADE.C; }
function prodById(id){ return (curData?curData.products:[]).find(p=>String(p.id)===String(id)); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = CATS.map(c=>
    `<button class="tab" data-key="${c.key}" onclick="selectCat('${c.key}')">${c.label}</button>`).join("");
}
function markTab(cat){ document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.key===cat)); }

async function selectCat(cat, presetIds){
  activeCat = cat; markTab(cat);
  selected = []; renderChips();
  document.getElementById('search').value = "";
  document.getElementById('list').innerHTML = "";
  document.getElementById('listMeta').textContent = "";
  document.getElementById('listStatus').textContent = "불러오는 중…";
  try{
    if (!cache[cat]){
      const res = await fetch(`${API}?category=${encodeURIComponent(cat)}`);
      if (!res.ok) throw new Error("HTTP "+res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.message||data.error);
      cache[cat] = data;
    }
    curData = cache[cat];
    preparePopulation(curData);
    document.getElementById('listStatus').textContent = "";
    if (presetIds && presetIds.length){
      selected = presetIds.map(String).filter(id => curData.products.some(p=>String(p.id)===id)).slice(0, MAX);
      renderChips();
      if (selected.length >= 2){ goCompare(); return; }  // 상위 비교 → 바로 비교표
    }
    renderList("");
  }catch(e){
    document.getElementById('listStatus').textContent = "불러오기 실패 ("+e.message+")";
  }
}
window.selectCat = selectCat;

function renderList(filter){
  if (!curData) return;
  const m = curData.metrics.primary;
  const f = (filter||"").trim().toLowerCase();
  const pool = curData._population || curData.products;
  const items = pool.filter(p=> !f || String(p.name).toLowerCase().indexOf(f)!==-1);
  document.getElementById('listMeta').textContent = `${activeCat} · ${items.length}개 · ${profileLabel()} 기준 · 최대 ${MAX}개 선택`;
  const atMax = selected.length >= MAX;
  document.getElementById('list').innerHTML = items.map(p=>{
    const g = gradeOf(p); const gl = gradeFromScore(vsOf(p)); const isSel = selected.indexOf(String(p.id))!==-1;
    const dim = atMax && !isSel ? " dim" : "";
    const img = p.image ? esc(p.image) : PLACEHOLDER;
    const sub = `${esc(m.label)} ${fmt(num(p.primaryValue))}${esc(m.unit)} · ${gl}등급`;
    return `<div class="prow${isSel?' sel':''}${dim}" onclick="toggleSel('${esc(String(p.id))}')">
      <div class="pcheck">${isSel?'✓':''}</div>
      <img class="pthumb" src="${img}" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
      <div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="psub">${sub}</div></div>
      <div class="pright"><div class="pvs">${vsOf(p)}</div></div>
    </div>`;
  }).join("");
  if (!items.length) document.getElementById('list').innerHTML = '<div class="status">검색 결과가 없습니다.</div>';
}

function toggleSel(id){
  id = String(id);
  const i = selected.indexOf(id);
  if (i!==-1) selected.splice(i,1);
  else { if (selected.length>=MAX) return; selected.push(id); }
  renderChips();
  renderList(document.getElementById('search').value);
}
window.toggleSel = toggleSel;

function renderChips(){
  const box = document.getElementById('selChips');
  if (!selected.length){ box.innerHTML = '<div class="selempty">비교할 제품을 2~3개 골라주세요</div>'; }
  else {
    box.innerHTML = selected.map(id=>{
      const p = prodById(id); if(!p) return "";
      return `<span class="selchip"><span>${esc(p.name)}</span><b onclick="event.stopPropagation();toggleSel('${esc(id)}')">×</b></span>`;
    }).join("");
  }
  const btn = document.getElementById('cmpBtn');
  const txt = document.getElementById('cmpBtnText');
  const finger = btn.querySelector('.cmp-finger');
  if (selected.length < 2){
    btn.classList.add('need'); btn.classList.remove('ready');
    if (finger) finger.style.display = "";
    txt.textContent = "비교하기 (2개 또는 3개 선택)";
  } else {
    btn.classList.remove('need'); btn.classList.add('ready');
    if (finger) finger.style.display = "none";
    txt.textContent = `비교하기 (${selected.length}개)`;
    const hint = document.getElementById('cmpHint'); if (hint) hint.textContent = "";
  }
}

function cell(val, unit, isBest){
  return `<td class="rcell${isBest?' best':''}"><span class="v">${val}</span>${unit?`<span class="unit"> ${unit}</span>`:''}${isBest?'<span class="best-dot">●</span>':''}</td>`;
}

function goCompare(){
  if (selected.length<2){
    const btn = document.getElementById('cmpBtn');
    const hint = document.getElementById('cmpHint');
    if (hint) hint.textContent = "제품을 2개 이상 선택해주세요";
    if (btn){ btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); }
    return;
  }
  const prods = selected.map(prodById).filter(Boolean);
  const m = curData.metrics.primary;
  // best 계산
  const primVals = prods.map(p=>num(p.primaryValue));
  const bestPrim = m.higherBetter===false ? Math.min(...primVals) : Math.max(...primVals);
  const costVals = prods.map(p=>num(p.dailyCost)).filter(v=>v>0);
  const bestCost = costVals.length?Math.min(...costVals):null;
  const priceVals = prods.map(p=>num(p.price)).filter(v=>v>0);
  const bestPrice = priceVals.length?Math.min(...priceVals):null;
  const capVals = prods.map(p=>num(p.capsuleMg)).filter(v=>v>0);
  const bestCap = capVals.length?Math.min(...capVals):null;

  const heads = prods.map(p=>{
    const g = gradeOf(p); const gl = gradeFromScore(vsOf(p)); const img = p.image?esc(p.image):PLACEHOLDER;
    return `<th class="ch-prod"><div class="pc">
      <img class="pc-thumb" src="${img}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
      <span class="pc-grade" style="background:${g[0]};color:${g[1]};border-color:${g[2]}">${gl}등급</span>
      <div class="pc-name">${esc(p.name)}</div>
      <div class="pc-vs">${vsOf(p)}<small> V-SCORE</small></div>
      <button class="pc-rm" onclick="removeFromCompare('${esc(String(p.id))}')">빼기</button>
    </div></th>`;
  }).join("");

  function row(label, fn){ return `<tr><td class="rlabel">${label}</td>${prods.map(fn).join("")}</tr>`; }

  let rows = "";
  rows += row(esc(m.label), p=> cell(fmt(num(p.primaryValue)), esc(m.unit), num(p.primaryValue)===bestPrim));
  rows += row("1일 비용", p=> cell(num(p.dailyCost)?fmt(num(p.dailyCost)):"—", num(p.dailyCost)?"원":"", bestCost!==null && num(p.dailyCost)===bestCost));
  rows += row("가격", p=> cell(num(p.price)?fmt(num(p.price)):"—", num(p.price)?"원":"", bestPrice!==null && num(p.price)===bestPrice));
  rows += row("캡슐 크기", p=> num(p.capsuleMg)>0 ? cell(fmt(num(p.capsuleMg)),"mg", bestCap!==null && num(p.capsuleMg)===bestCap) : cell("분말/스틱","",false));
  rows += row("제형", p=> cell(esc(p.form||"—"),"",false));
  rows += row("원료사", p=> cell(esc(p.supplier||"—"),"",false));
  rows += row("인증", p=> cell(esc(String(p.certs||"—").slice(0,40)),"",false));
  rows += row("주된 기능성", p=> cell(esc(String(p.function||"—").slice(0,40)),"",false));

  const cart = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>`;
  const buys = `<div class="buyrow">${prods.map(p=> p.link
      ? `<a class="buy" href="${esc(p.link)}" target="_blank" rel="noopener" title="${esc(p.name)}" data-product="${esc(p.name)}"><span class="buy-cap">${esc(p.name.slice(0,10))}</span><span class="buy-act">${cart}구매하러 가기</span></a>`
      : `<span class="buy disabled" title="${esc(p.name)}"><span class="buy-cap">${esc(p.name.slice(0,10))}</span><span class="buy-act">${cart}링크 없음</span></span>`).join("")}</div>`;

  const basis = `<div class="cmp-basis"><b>${profileLabel()} 기준</b><span>V-SCORE·등급은 선택한 기준에 따라 달라집니다</span></div>`;
  document.getElementById('compareTable').innerHTML =
    `${basis}<div class="cmpwrap"><table class="cmp"><thead><tr><th class="ch-head"></th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>${buys}`;

  document.getElementById('selectView').style.display = "none";
  document.getElementById('compareView').style.display = "block";
  document.getElementById('hTitle').textContent = `${activeCat} 비교`;
  window.scrollTo(0,0);
}
window.goCompare = goCompare;

function removeFromCompare(id){
  toggleSel(id);
  if (selected.length<2) backToSelect();
  else goCompare();
}
window.removeFromCompare = removeFromCompare;

function backToSelect(){
  document.getElementById('compareView').style.display = "none";
  document.getElementById('selectView').style.display = "block";
  document.getElementById('hTitle').textContent = "제품 비교";
  renderChips(); renderList(document.getElementById('search').value);
  window.scrollTo(0,0);
}
window.backToSelect = backToSelect;

document.getElementById('search').addEventListener('input', e=> renderList(e.target.value));

// init
renderTabs();
const params = new URLSearchParams(location.search);
const idsParam = (params.get('ids')||"").split(',').map(s=>s.trim()).filter(Boolean);
const startCat = CATS.find(c=>c.key===params.get('category')) ? params.get('category') : CATS[0].key;
// 기준: app.html에서 넘어온 balanced/premium/budget만 인정. 그 외(카운슬링의 premium_seeker 등)·미지정 → 균형
const pParam = params.get('profile');
if (PROFILES.some(x=>x.key===pParam)) activeProfile = pParam;
activeSubKey = params.get('sub') || null;
selectCat(startCat, idsParam.length ? idsParam : null);
