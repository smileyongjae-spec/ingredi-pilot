<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B3A2E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ingredi">
<title>ingredi · 제품 비교</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --green-deep:#1B3A2E; --green-primary:#2D5F3F; --green-mid:#4A7C5A;
    --green-light:#E8F1EA; --green-bg:#F5F9F6; --paper:#FAF8F3;
    --ink:#1A1F1B; --ink-soft:#4F564E; --ink-faint:#8B928A;
    --line:#D9DDD7; --line-soft:#ECEFEA; --gold:#B8902F; --warn:#C9533D;
    --shadow-sm:0 1px 2px rgba(27,58,46,.06); --shadow-md:0 4px 12px rgba(27,58,46,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px rgba(27,58,46,.05)}
  .header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-soft);background:var(--paper);position:sticky;top:0;z-index:20}
  .hb{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);text-decoration:none;border-radius:8px}
  .hb:hover{background:var(--green-light)}
  .htitle{font-size:18px;font-weight:700;color:var(--green-deep)}
  .hspacer{width:36px}
  .body{padding:16px 18px 40px}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:14px;font-family:inherit;font-weight:600;padding:9px 16px;border-radius:22px;cursor:pointer;white-space:nowrap;transition:.15s}
  .tab.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}

  .seltray{position:sticky;top:65px;z-index:10;background:var(--paper);padding:6px 0 12px;border-bottom:1px solid var(--line-soft)}
  .selchips{display:flex;gap:7px;flex-wrap:wrap;min-height:34px}
  .selchip{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green-deep);font-size:13px;font-weight:600;padding:6px 9px 6px 11px;border-radius:100px;max-width:200px}
  .selchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selchip b{cursor:pointer;color:var(--green-primary);font-weight:700;font-size:15px;line-height:1}
  .selempty{font-size:13px;color:var(--ink-faint);padding:8px 2px}
  .cmpbtn{width:100%;margin-top:10px;padding:14px;background:var(--green-primary);color:#fff;border:none;border-radius:11px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .cmpbtn:hover{background:var(--green-deep)}
  .cmpbtn.need{animation:cmpPulse 2.4s ease-in-out infinite}
  .cmpbtn.ready{box-shadow:0 3px 10px rgba(45,95,63,.28)}
  .cmpbtn.shake{animation:cmpShake .4s}
  .cmp-finger{animation:fingerBlink 1.6s ease-in-out infinite}
  @keyframes cmpPulse{0%,100%{box-shadow:0 0 0 0 rgba(45,95,63,.42)}50%{box-shadow:0 0 0 7px rgba(45,95,63,0)}}
  @keyframes fingerBlink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes cmpShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .cmp-hint{font-size:11px;color:var(--warn);margin-top:6px;min-height:0}

  .search{width:100%;margin:14px 0 10px;padding:11px 14px;background:#fff;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;color:var(--ink)}
  .search:focus{outline:none;border-color:var(--green-primary);box-shadow:0 0 0 3px rgba(45,95,63,.08)}
  .meta{font-size:12px;color:var(--ink-faint);padding:2px 2px 8px}

  .prow{display:flex;align-items:center;gap:11px;padding:11px 12px;background:#fff;border:1.5px solid var(--line-soft);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .prow:hover{border-color:var(--green-mid)}
  .prow.sel{border-color:var(--green-primary);background:var(--green-bg)}
  .prow.dim{opacity:.45}
  .pthumb{width:42px;height:42px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--green-bg);border:1px solid var(--line-soft)}
  .pinfo{flex:1;min-width:0}
  .pname{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .psub{font-size:12px;color:var(--ink-faint);margin-top:2px}
  .pright{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0}
  .pvs{font-size:16px;font-weight:800;color:var(--green-deep);line-height:1.1}
  .pgrade{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;border:1px solid}
  .pcheck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .prow.sel .pcheck{background:var(--green-primary);border-color:var(--green-primary)}

  .status{padding:50px 18px;text-align:center;color:var(--ink-faint);font-size:14px}

  /* 비교표 */
  .cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px -2px 0;padding:2px}
  table.cmp{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
  table.cmp th,table.cmp td{vertical-align:top;text-align:left}
  .ch-head{position:sticky;left:0;background:var(--paper);z-index:2;width:52px;min-width:52px;font-size:12px;color:var(--ink-faint);font-weight:600;padding:12px 6px 12px 2px;border-bottom:1px solid var(--line-soft)}
  .ch-prod{padding:0 4px 12px}
  .pc{background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:9px 7px;box-shadow:var(--shadow-sm)}
  .pc-thumb{width:100%;max-width:60px;aspect-ratio:1;height:auto;border-radius:9px;object-fit:cover;background:var(--green-bg);border:1px solid var(--line-soft);display:block;margin-bottom:7px}
  .pc-grade{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid;margin-bottom:5px}
  .pc-name{font-size:11.5px;font-weight:700;color:var(--green-deep);line-height:1.3;height:45px;overflow:hidden;overflow-wrap:anywhere}
  .pc-vs{font-size:20px;font-weight:800;color:var(--green-deep);letter-spacing:-.03em;margin-top:5px}
  .pc-vs small{font-size:9px;font-weight:600;color:var(--ink-faint);letter-spacing:.03em}
  .pc-rm{display:block;width:100%;margin-top:7px;padding:5px;background:var(--green-light);color:var(--green-deep);border:none;border-radius:7px;font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer}
  .rlabel{position:sticky;left:0;background:var(--paper);z-index:2;font-size:11px;color:var(--ink-faint);font-weight:600;padding:11px 4px 11px 2px;border-top:1px solid var(--line-soft);line-height:1.25}
  .rcell{padding:11px 4px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
  .rcell .v{font-weight:700;color:var(--green-deep)}
  .rcell.best .v{color:var(--green-primary)}
  .best-dot{display:inline-block;font-size:10px;color:var(--green-primary);margin-left:3px;vertical-align:middle}
  .rcell .unit{font-size:11px;color:var(--ink-faint);font-weight:500}
  .buyrow{display:flex;gap:8px;margin-top:14px}
  .buy{flex:1;text-align:center;padding:11px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;background:var(--green-primary);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .backsel{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--green-primary);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 0 14px}

  footer{padding:24px 4px 40px;font-size:11px;color:var(--ink-faint);line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <a class="hb" id="backLink" href="/app.html" aria-label="뒤로" onclick="smartBack('/app.html');return false;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="htitle" id="hTitle">제품 비교</div>
    <div class="hspacer"></div>
  </header>
  <div class="body">
    <!-- 선택 화면 -->
    <div id="selectView">
      <div class="tabs" id="tabs"></div>
      <div class="seltray">
        <div class="selchips" id="selChips"></div>
        <button class="cmpbtn need" id="cmpBtn" onclick="goCompare()"><span class="cmp-finger">👆</span><span id="cmpBtnText">비교하기 (2개 또는 3개 선택)</span></button>
        <div class="cmp-hint" id="cmpHint"></div>
      </div>
      <input class="search" id="search" placeholder="제품명 검색" autocomplete="off">
      <div class="meta" id="listMeta"></div>
      <div id="list"></div>
      <div class="status" id="listStatus"></div>
    </div>
    <!-- 비교 화면 -->
    <div id="compareView" style="display:none">
      <button class="backsel" onclick="backToSelect()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        제품 다시 고르기
      </button>
      <div id="compareTable"></div>
      <footer>
        ingredi는 제품사로부터 어떠한 광고비도 받지 않습니다. 모든 비교는 공개 데이터·임상 근거 기준이며, 쿠팡 파트너스 활동의 일환으로 일정액의 수수료를 받을 수 있습니다.
      </footer>
    </div>
  </div>
</div>

<script>
const API = window.location.origin + "/recommend2";

// 백버튼 표준: 같은 사이트에서 왔으면 진짜 직전 화면, 직접 진입이면 폴백
function smartBack(fallback) {
  try {
    const ref = document.referrer;
    if (history.length > 1 && ref && new URL(ref).origin === location.origin) {
      history.back();
      return;
    }
  } catch (e) {}
  location.href = fallback || '/app.html';
}
window.smartBack = smartBack;
const CATS = [
  { key:"오메가3", label:"오메가3" }, { key:"눈", label:"눈 건강" },
  { key:"마이크로바이옴", label:"유산균" }, { key:"비타민C", label:"비타민C" }
];
const GRADE = {
  S:["#FAF3E0","#B8902F","#EAD9A8"], A:["#F0F0F2","#6E7177","#DADCE0"],
  B:["#EAF1EA","#2D5F3F","#CADBCD"], C:["#F6ECE3","#B07142","#E6D2C2"], D:["#F0EFEC","#8B8E91","#DEDCD6"]
};
const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 58 58"><rect width="58" height="58" rx="13" fill="#EEF1EC"/><rect x="22" y="12" width="14" height="7" rx="2" fill="#9FB6A4"/><rect x="17" y="18" width="24" height="29" rx="6" fill="#2D5F3F"/><rect x="17" y="29" width="24" height="9" fill="#fff" opacity="0.9"/></svg>'
);
const MAX = 3;

const cache = {};
let activeCat = null;
let curData = null;          // 현재 카테고리 응답
let selected = [];           // 선택된 product id (현재 카테고리 한정)

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function fmt(n){ return Number(n).toLocaleString('ko-KR'); }
function gradeOf(g){ return GRADE[(g||"").charAt(0).toUpperCase()] || GRADE.B; }
function prodById(id){ return (curData?curData.products:[]).find(p=>String(p.id)===String(id)); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = CATS.map(c=>
    `<button class="tab" data-key="${c.key}" onclick="selectCat('${c.key}')">${c.label}</button>`).join("");
}
function markTab(cat){ document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.key===cat)); }

async function selectCat(cat, presetIds){
  activeCat = cat; markTab(cat);
  selected = []; renderChips();
  document.getElementById('search').value = "";
  document.getElementById('list').innerHTML = "";
  document.getElementById('listMeta').textContent = "";
  document.getElementById('listStatus').textContent = "불러오는 중…";
  try{
    if (!cache[cat]){
      const res = await fetch(`${API}?category=${encodeURIComponent(cat)}`);
      if (!res.ok) throw new Error("HTTP "+res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.message||data.error);
      cache[cat] = data;
    }
    curData = cache[cat];
    document.getElementById('listStatus').textContent = "";
    if (presetIds && presetIds.length){
      selected = presetIds.map(String).filter(id => curData.products.some(p=>String(p.id)===id)).slice(0, MAX);
      renderChips();
      if (selected.length >= 2){ goCompare(); return; }  // 상위 비교 → 바로 비교표
    }
    renderList("");
  }catch(e){
    document.getElementById('listStatus').textContent = "불러오기 실패 ("+e.message+")";
  }
}
window.selectCat = selectCat;

function renderList(filter){
  if (!curData) return;
  const m = curData.metrics.primary;
  const f = (filter||"").trim().toLowerCase();
  const items = curData.products.filter(p=> !f || String(p.name).toLowerCase().indexOf(f)!==-1);
  document.getElementById('listMeta').textContent = `${activeCat} · ${items.length}개 · 최대 ${MAX}개 선택`;
  const atMax = selected.length >= MAX;
  document.getElementById('list').innerHTML = items.map(p=>{
    const g = gradeOf(p.grade); const isSel = selected.indexOf(String(p.id))!==-1;
    const dim = atMax && !isSel ? " dim" : "";
    const img = p.image ? esc(p.image) : PLACEHOLDER;
    const sub = `${esc(m.label)} ${fmt(num(p.primaryValue))}${esc(m.unit)} · ${esc(p.grade||'-')}등급`;
    return `<div class="prow${isSel?' sel':''}${dim}" onclick="toggleSel('${esc(String(p.id))}')">
      <div class="pcheck">${isSel?'✓':''}</div>
      <img class="pthumb" src="${img}" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
      <div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="psub">${sub}</div></div>
      <div class="pright"><div class="pvs">${Math.round(num(p.vScore))}</div></div>
    </div>`;
  }).join("");
  if (!items.length) document.getElementById('list').innerHTML = '<div class="status">검색 결과가 없습니다.</div>';
}

function toggleSel(id){
  id = String(id);
  const i = selected.indexOf(id);
  if (i!==-1) selected.splice(i,1);
  else { if (selected.length>=MAX) return; selected.push(id); }
  renderChips();
  renderList(document.getElementById('search').value);
}
window.toggleSel = toggleSel;

function renderChips(){
  const box = document.getElementById('selChips');
  if (!selected.length){ box.innerHTML = '<div class="selempty">비교할 제품을 2~3개 골라주세요</div>'; }
  else {
    box.innerHTML = selected.map(id=>{
      const p = prodById(id); if(!p) return "";
      return `<span class="selchip"><span>${esc(p.name)}</span><b onclick="event.stopPropagation();toggleSel('${esc(id)}')">×</b></span>`;
    }).join("");
  }
  const btn = document.getElementById('cmpBtn');
  const txt = document.getElementById('cmpBtnText');
  const finger = btn.querySelector('.cmp-finger');
  if (selected.length < 2){
    btn.classList.add('need'); btn.classList.remove('ready');
    if (finger) finger.style.display = "";
    txt.textContent = "비교하기 (2개 또는 3개 선택)";
  } else {
    btn.classList.remove('need'); btn.classList.add('ready');
    if (finger) finger.style.display = "none";
    txt.textContent = `비교하기 (${selected.length}개)`;
    const hint = document.getElementById('cmpHint'); if (hint) hint.textContent = "";
  }
}

function cell(val, unit, isBest){
  return `<td class="rcell${isBest?' best':''}"><span class="v">${val}</span>${unit?`<span class="unit"> ${unit}</span>`:''}${isBest?'<span class="best-dot">●</span>':''}</td>`;
}

function goCompare(){
  if (selected.length<2){
    const btn = document.getElementById('cmpBtn');
    const hint = document.getElementById('cmpHint');
    if (hint) hint.textContent = "제품을 2개 이상 선택해주세요";
    if (btn){ btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); }
    return;
  }
  const prods = selected.map(prodById).filter(Boolean);
  const m = curData.metrics.primary;
  // best 계산
  const primVals = prods.map(p=>num(p.primaryValue));
  const bestPrim = m.higherBetter===false ? Math.min(...primVals) : Math.max(...primVals);
  const costVals = prods.map(p=>num(p.dailyCost)).filter(v=>v>0);
  const bestCost = costVals.length?Math.min(...costVals):null;
  const priceVals = prods.map(p=>num(p.price)).filter(v=>v>0);
  const bestPrice = priceVals.length?Math.min(...priceVals):null;
  const capVals = prods.map(p=>num(p.capsuleMg)).filter(v=>v>0);
  const bestCap = capVals.length?Math.min(...capVals):null;
  const vsVals = prods.map(p=>num(p.vScore));
  const bestVs = Math.max(...vsVals);

  const heads = prods.map(p=>{
    const g = gradeOf(p.grade); const img = p.image?esc(p.image):PLACEHOLDER;
    return `<th class="ch-prod"><div class="pc">
      <img class="pc-thumb" src="${img}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
      <span class="pc-grade" style="background:${g[0]};color:${g[1]};border-color:${g[2]}">${esc(p.grade||'-')}등급</span>
      <div class="pc-name">${esc(p.name)}</div>
      <div class="pc-vs">${Math.round(num(p.vScore))}<small> V-SCORE</small></div>
      <button class="pc-rm" onclick="removeFromCompare('${esc(String(p.id))}')">빼기</button>
    </div></th>`;
  }).join("");

  function row(label, fn){ return `<tr><td class="rlabel">${label}</td>${prods.map(fn).join("")}</tr>`; }

  let rows = "";
  rows += row(esc(m.label), p=> cell(fmt(num(p.primaryValue)), esc(m.unit), num(p.primaryValue)===bestPrim));
  rows += row("V-Score", p=> cell(Math.round(num(p.vScore)), "", num(p.vScore)===bestVs));
  rows += row("1일 비용", p=> cell(num(p.dailyCost)?fmt(num(p.dailyCost)):"—", num(p.dailyCost)?"원":"", bestCost!==null && num(p.dailyCost)===bestCost));
  rows += row("가격", p=> cell(num(p.price)?fmt(num(p.price)):"—", num(p.price)?"원":"", bestPrice!==null && num(p.price)===bestPrice));
  rows += row("캡슐 크기", p=> num(p.capsuleMg)>0 ? cell(fmt(num(p.capsuleMg)),"mg", bestCap!==null && num(p.capsuleMg)===bestCap) : cell("분말/스틱","",false));
  rows += row("제형", p=> cell(esc(p.form||"—"),"",false));
  rows += row("원료사", p=> cell(esc(p.supplier||"—"),"",false));
  rows += row("인증", p=> cell(esc(String(p.certs||"—").slice(0,40)),"",false));
  rows += row("주된 기능성", p=> cell(esc(String(p.function||"—").slice(0,40)),"",false));

  const buys = `<div class="buyrow">${prods.map(p=> p.link
      ? `<a class="buy" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.name.slice(0,8))} 보기</a>`
      : `<span class="buy" style="background:var(--line);color:var(--ink-faint)">링크 없음</span>`).join("")}</div>`;

  document.getElementById('compareTable').innerHTML =
    `<div class="cmpwrap"><table class="cmp"><thead><tr><th class="ch-head"></th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>${buys}`;

  document.getElementById('selectView').style.display = "none";
  document.getElementById('compareView').style.display = "block";
  document.getElementById('hTitle').textContent = `${activeCat} 비교`;
  window.scrollTo(0,0);
}
window.goCompare = goCompare;

function removeFromCompare(id){

<!-- "구매하러 가기" 클릭 이벤트 (범용 · 이벤트 위임) -->
<script type="text/javascript">
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var txt = (a.textContent || '').replace(/\s+/g, '');
    var isBuy = txt.indexOf('구매하러가기') !== -1
             || /cv-buybtn|btn-mini\s+primary|buy/i.test(a.className || '');
    if (!isBuy) return;
    if (a.classList && a.classList.contains('disabled')) return;
    if (typeof window.clarity !== 'function') return;
    try {
      window.clarity('event', 'purchase_click');
      var cat = window.activeCat || window.CURRENT_CAT_KO || '';
      if (cat) window.clarity('set', 'category', String(cat));
      var card = a.closest('.cv-card, .product-card, .cr-card, [class*="card"]');
      var nm = card && card.querySelector('.cv-name, .product-name, .cr-name, h2, h3');
      if (nm) window.clarity('set', 'product', nm.textContent.trim().slice(0, 60));
    } catch (_) {}
  });
</script>
