<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ingredi · 제품 비교</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --green-deep: #1B3A2E; --green-primary: #2D5F3F; --green-mid: #4A7C5A;
      --green-light: #E8F1EA; --green-bg: #F5F9F6;
      --paper: #FAF8F3; --ink: #1A1F1B; --ink-soft: #4F564E;
      --ink-faint: #8B928A; --line: #D9DDD7; --line-soft: #ECEFEA;
      --gold: #B8902F; --silver: #8B8E91; --bronze: #B07142; --warn: #C9533D;
      --blue: #2563EB; --blue-light: #EFF6FF; --blue-mid: #BFDBFE;
      --bar-green: #2D5F3F; --bar-blue: #2563EB; --bar-amber: #B07142; --bar-red: #C9533D;
      --shadow-sm: 0 1px 2px rgba(27, 58, 46, 0.06);
      --shadow-md: 0 4px 12px rgba(27, 58, 46, 0.08);
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper); color: var(--ink);
      font-size: 14px; line-height: 1.5; letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); box-shadow: 0 0 40px rgba(27,58,46,0.05); }

    /* 헤더 */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); background: var(--paper); position: sticky; top: 0; z-index: 10; }
    .header-back { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); border-radius: var(--radius-sm); text-decoration: none; }
    .header-back:hover { background: var(--green-light); }
    .header-back svg { width: 22px; height: 22px; }
    .header-title { font-size: 16px; font-weight: 700; color: var(--green-deep); }
    .header-spacer { width: 36px; }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 로딩 */
    .loading-screen { text-align: center; padding: 60px 20px; }
    .loading-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--green-primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--ink-soft); }

    /* 선택 화면 */
    .select-wrap { padding: 20px; }
    .select-header { margin-bottom: 16px; text-align: center; }
    .select-eyebrow { font-size: 11px; font-weight: 600; color: var(--green-mid); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .select-title { font-size: 20px; font-weight: 800; color: var(--green-deep); letter-spacing: -0.02em; margin-bottom: 4px; }
    .select-subtitle { font-size: 12px; color: var(--ink-faint); }
    .selection-counter { position: sticky; top: 64px; background: var(--green-deep); color: white; padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-md); z-index: 5; }
    .selection-count { font-size: 13px; font-weight: 600; }
    .selection-action { padding: 6px 14px; background: white; color: var(--green-deep); border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .selection-action:disabled { opacity: 0.4; cursor: not-allowed; }
    .product-list { display: flex; flex-direction: column; gap: 8px; }
    .product-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: white; border: 1.5px solid var(--line-soft); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s ease; }
    .product-item:hover { border-color: var(--green-mid); }
    .product-item.selected { border-color: var(--green-primary); background: var(--green-bg); }
    .product-item.disabled { opacity: 0.4; cursor: not-allowed; }
    .product-item-checkbox { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: white; transition: all 0.15s ease; }
    .product-item.selected .product-item-checkbox { background: var(--green-primary); border-color: var(--green-primary); color: white; }
    .product-item-checkbox svg { width: 14px; height: 14px; opacity: 0; }
    .product-item.selected .product-item-checkbox svg { opacity: 1; }
    .product-item-image { width: 44px; height: 56px; object-fit: cover; border-radius: 6px; background: var(--green-bg); flex-shrink: 0; }
    .product-item-image-fallback { width: 44px; height: 56px; border-radius: 6px; background: var(--green-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .product-item-image-fallback svg { width: 20px; height: 20px; stroke: var(--ink-faint); }
    .product-item-info { flex: 1; min-width: 0; }
    .product-item-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .product-item-meta { font-size: 11px; color: var(--ink-faint); }
    .product-item-tier { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
    .product-item-tier.tier-1 { background: var(--gold); color: white; }
    .product-item-tier.tier-2 { background: var(--silver); color: white; }
    .product-item-tier.tier-3 { background: rgba(176,113,66,0.15); color: var(--bronze); }
    .product-item-tier.tier-fail { background: rgba(201,83,61,0.15); color: var(--warn); }

    /* ── 비교 결과 ── */
    .compare-wrap { }

    /* 상단 헤더 (다크그린) */
    .compare-hero { background: var(--green-deep); padding: 16px 20px 0; }
    .compare-hero-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .compare-hero-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-bottom: 3px; }
    .compare-hero-title { font-size: 20px; font-weight: 800; color: white; letter-spacing: -0.02em; }
    .compare-hero-meta { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 2px; }
    .compare-change-btn { display: flex; align-items: center; gap: 4px; padding: 7px 12px; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2); border-radius: 8px; color: rgba(255,255,255,0.8); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .compare-change-btn:hover { background: rgba(255,255,255,0.18); }
    .compare-change-btn svg { width: 13px; height: 13px; stroke: rgba(255,255,255,0.7); }

    /* 프로필 탭 */
    .profile-tabs { display: flex; gap: 6px; padding: 12px 0 0; overflow-x: auto; scrollbar-width: none; }
    .profile-tabs::-webkit-scrollbar { display: none; }
    .profile-tab { font-size: 11px; padding: 5px 12px; border-radius: 100px; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); white-space: nowrap; flex-shrink: 0; cursor: pointer; transition: all 0.15s; }
    .profile-tab.active { background: white; border-color: white; color: var(--green-deep); font-weight: 700; }
    .profile-tab:hover:not(.active) { background: rgba(255,255,255,0.15); }

    /* 탭 하단 여백 패딩 */
    .compare-hero-bottom { height: 16px; }

    /* 비교 본문 */
    .compare-body { padding: 16px 20px 40px; }


    /* 제품 카드 그리드 (상단) */
    .product-cards {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }
    .product-cards.cols-1 { grid-template-columns: 1fr; }
    .product-cards.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .product-cards.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .product-card { background: white; border: 0.5px solid var(--line-soft); border-radius: var(--radius-md); padding: 10px 8px; position: relative; box-sizing: border-box; min-width: 0; overflow: hidden; }
    .product-card.rank-1 { border: 1.5px solid var(--blue); }
    .product-card.rank-2 { border: 0.5px solid var(--silver); }
    .product-card.rank-3 { border: 0.5px solid var(--bronze); }
    .product-card-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; display: inline-block; margin-bottom: 8px; letter-spacing: 0.02em; }
    .rank-1 .product-card-badge { background: var(--blue-light); color: var(--blue); }
    .rank-2 .product-card-badge { background: rgba(139,142,145,0.12); color: var(--silver); }
    .rank-3 .product-card-badge { background: rgba(176,113,66,0.1); color: var(--bronze); }
    .product-card-img { width: 52px; height: 66px; border-radius: 6px; object-fit: cover; background: var(--green-bg); display: block; margin: 0 auto 8px; }
    .product-card-img-fallback { width: 52px; height: 66px; border-radius: 6px; background: var(--green-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
    .product-card-img-fallback svg { width: 22px; height: 22px; stroke: var(--ink-faint); }
    .product-card-name { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-card-score { font-size: 24px; font-weight: 800; color: var(--green-deep); line-height: 1; letter-spacing: -0.04em; }
    .product-card-score-lbl { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; font-weight: 600; margin-bottom: 10px; }
    .product-card-divider { border: none; border-top: 0.5px solid var(--line-soft); margin: 8px 0; }
    .product-card-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
    .product-card-row-lbl { font-size: 12px; color: var(--ink-faint); }
    .product-card-row-val { font-size: 12px; font-weight: 600; color: var(--ink); }
    .product-card-row-val.good { color: var(--green-primary); }
    .product-card-row-val.warn { color: var(--bronze); }
    .product-card-tags { display: flex; gap: 3px; flex-wrap: wrap; margin: 6px 0; }
    .pc-tag { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: var(--green-bg); color: var(--ink-soft); }
    .pc-tag.hi { background: var(--green-light); color: var(--green-deep); font-weight: 700; }

    /* V-Score 바 (카드 내부) */
    .pc-bars { margin-top: 8px; }
    .pc-bar-row { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
    .pc-bar-lbl { font-size: 10px; color: var(--ink-faint); width: 22px; flex-shrink: 0; }
    .pc-bar-track { flex: 1; height: 5px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
    .pc-bar-fill { height: 100%; border-radius: 2px; }
    .pc-bar-fill.green { background: var(--bar-green); }
    .pc-bar-fill.blue  { background: var(--bar-blue); }
    .pc-bar-fill.amber { background: var(--bar-amber); }
    .pc-bar-fill.red   { background: var(--bar-red); }
    .pc-bar-num { font-size: 10px; color: var(--ink-faint); width: 22px; text-align: right; flex-shrink: 0; }

    /* 상세 비교 테이블 */
    .section-label { font-size: 12px; font-weight: 700; color: var(--green-deep); letter-spacing: -0.01em; margin: 20px 0 8px; padding-left: 2px; }
    .cmp-table { background: white; border: 0.5px solid var(--line-soft); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 16px; }
    .cmp-table-head { display: flex; flex-direction: row; background: var(--green-bg); }
    
    
    
    
    .cmp-table-hcell { font-size: 11px; font-weight: 700; color: var(--ink-soft); padding: 9px 6px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmp-table-hcell:first-child { text-align: left; padding-left: 12px; }
    .cmp-table-row { display: flex; flex-direction: row; border-top: 0.5px solid var(--line-soft); }
    .cmp-table-hcell:first-child, .cmp-table-cell:first-child { width: 80px; flex-shrink: 0; }
    .cmp-table-hcell:not(:first-child), .cmp-table-cell:not(:first-child) { flex: 1 1 0; min-width: 0; }
    .cmp-table-row:nth-child(even) { background: #FAFAF8; }
    .cmp-table-cell { font-size: 13px; color: var(--ink); padding: 9px 6px; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 40px; }
    .cmp-table-cell:first-child { font-size: 12px; color: var(--ink-soft); justify-content: flex-start; padding-left: 12px; font-weight: 600; }
    .cmp-table-cell.best { color: var(--blue); font-weight: 700; }

    /* 인사이트 */
    .insights { background: white; border: 0.5px solid var(--line-soft); border-radius: var(--radius-md); padding: 14px; margin-bottom: 16px; }
    .insights-title { font-size: 12px; font-weight: 700; color: var(--green-deep); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .insights-title svg { width: 15px; height: 15px; stroke: var(--green-primary); }
    .insight-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
    .insight-icon { flex-shrink: 0; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .insight-icon svg { width: 14px; height: 14px; stroke: var(--green-mid); }
    .insight-text strong { color: var(--green-deep); font-weight: 700; }

    /* CTA */
    .compare-actions { display: grid; gap: 8px; margin-top: 20px; }
    .compare-action-link { padding: 12px 14px; background: var(--green-primary); color: white; text-decoration: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: space-between; }
    .compare-action-link:hover { background: var(--green-deep); }
    .compare-action-link.disabled { background: var(--line); color: var(--ink-faint); cursor: not-allowed; pointer-events: none; }
    .compare-action-link-left { display: flex; flex-direction: column; }
    .compare-action-link-name { font-size: 11px; opacity: 0.8; font-weight: 500; margin-bottom: 1px; }
    .compare-action-link-label { font-size: 13px; font-weight: 700; }
    .compare-action-link svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.7); flex-shrink: 0; }

    .disclaimer { margin-top: 24px; padding: 14px; font-size: 10px; color: var(--ink-faint); text-align: center; line-height: 1.6; border-top: 1px solid var(--line-soft); }
    .error-box { text-align: center; padding: 40px 20px; color: var(--warn); }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <a class="header-back" href="/app.html" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <div class="header-title">제품 비교</div>
    <div class="header-spacer"></div>
  </header>

  <div class="screen loading-screen active" id="screenLoading">
    <div class="loading-spinner"></div>
    <div class="loading-text">제품 정보를 불러오는 중…</div>
  </div>

  <main class="screen" id="screenSelect">
    <div class="select-wrap">
      <div class="select-header">
        <div class="select-eyebrow">최대 3개까지 선택</div>
        <h1 class="select-title">비교할 제품 고르기</h1>
        <p class="select-subtitle">함량·제형·가격을 한눈에 비교해드려요</p>
      </div>
      <div class="selection-counter">
        <span class="selection-count" id="selectionCount">0/3개 선택됨</span>
        <button class="selection-action" id="compareBtn" disabled>비교하기 →</button>
      </div>
      <div class="product-list" id="productList"></div>
    </div>
  </main>

  <main class="screen" id="screenCompare">
    <div class="compare-wrap">
      <!-- 헤더 -->
      <div class="compare-hero">
        <div class="compare-hero-top">
          <div>
            <div class="compare-hero-eyebrow">INGREDI 한눈에 비교</div>
            <div class="compare-hero-title" id="compareTitle">3개 제품 비교</div>
            <div class="compare-hero-meta" id="compareMeta">균형형 기준</div>
          </div>
          <button class="compare-change-btn" id="changeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            다른 제품으로
          </button>
        </div>
        <div class="profile-tabs" id="profileTabs"></div>
        <div class="compare-hero-bottom"></div>
      </div>

      <!-- 본문 -->
      <div class="compare-body">
        <div id="compareContent"></div>
        <div class="disclaimer" id="compareDisclaimer"></div>
      </div>
    </div>
  </main>
</div>

<script>
const API_BASE = window.location.origin;
const params = new URLSearchParams(window.location.search);
const profile = params.get('profile') || 'balanced';
const idsParam = params.get('ids');
const mode = params.get('mode');

let allProducts = [];
let selectedIds = [];

const PROFILES = [
  { id: 'balanced',       label: '균형형' },
  { id: 'premium_seeker', label: '최고품질' },
  { id: 'budget_seeker',  label: '가성비' },
  { id: 'pregnancy',      label: '임산부' },
  { id: 'senior',         label: '시니어' },
  { id: 'vegan',          label: '비건' },
  { id: 'kid',            label: '어린이' }
];

const PILL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l8-8a4.95 4.95 0 0 1 7 7l-8 8a4.95 4.95 0 0 1-7-7z"/><path d="M8.5 8.5l7 7"/></svg>';

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeNum(v, fb=0) { const n=Number(v); return isNaN(n)?fb:n; }
function barColor(v) {
  if (v >= 80) return 'green';
  if (v >= 60) return 'blue';
  if (v >= 40) return 'amber';
  return 'red';
}

// 프로필 탭 렌더
function renderProfileTabs(currentId) {
  const el = document.getElementById('profileTabs');
  if (!el) return;
  el.innerHTML = PROFILES.map(p => {
    const active = p.id === currentId ? ' active' : '';
    return `<div class="profile-tab${active}" onclick="switchProfile('${p.id}')">${p.label}</div>`;
  }).join('');
}
function switchProfile(pid) {
  const ids = idsParam || '';
  if (ids) {
    window.location.href = `/compare.html?ids=${ids}&profile=${pid}`;
  } else {
    window.location.href = `/compare.html?mode=select&profile=${pid}`;
  }
}
window.switchProfile = switchProfile;

if (idsParam) {
  loadComparison(idsParam);
} else {
  loadSelectMode();
}

// ── 선택 화면 ──
async function loadSelectMode() {
  showScreen('Loading');
  try {
    const res = await fetch(`${API_BASE}/recommend?profile=${profile}&includeFailed=true`);
    const data = await res.json();
    allProducts = [];
    if (data.top3) data.top3.forEach(p => allProducts.push({ id:p.id, name:p.name, image:p.image, vScore:p.vScore, tier:p.keySpec.tier, passFail:p.passFail }));
    if (data.rest)  data.rest.forEach(p  => allProducts.push({ id:p.id, name:p.name, image:p.image, vScore:p.vScore, tier:p.tier, passFail:'' }));
    renderProductList();
    showScreen('Select');
  } catch (err) { showError('제품 목록을 불러올 수 없습니다.'); }
}

function renderProductList() {
  const list = document.getElementById('productList');
  list.innerHTML = allProducts.map(p => {
    const tierClass = p.tier ? p.tier.toLowerCase().replace('tier','tier-') : 'tier-fail';
    const imageHtml = p.image
      ? `<img class="product-item-image" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'"\\'")}</div>'">`
      : `<div class="product-item-image-fallback">${PILL_SVG}</div>`;
    return `
      <div class="product-item" data-id="${p.id}" onclick="toggleSelect('${p.id}')">
        <div class="product-item-checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        ${imageHtml}
        <div class="product-item-info">
          <div class="product-item-name">${escapeHtml(p.name)}</div>
          <div class="product-item-meta">V-Score ${p.vScore}점</div>
        </div>
        <span class="product-item-tier ${tierClass}">${escapeHtml(p.tier||'Fail')}</span>
      </div>`;
  }).join('');
}

function toggleSelect(id) {
  const idx = selectedIds.indexOf(id);
  if (idx >= 0) selectedIds.splice(idx, 1);
  else { if (selectedIds.length >= 3) return; selectedIds.push(id); }
  document.querySelectorAll('.product-item').forEach(el => {
    const iid = el.dataset.id;
    const sel = selectedIds.indexOf(iid) !== -1;
    el.classList.toggle('selected', sel);
    el.classList.toggle('disabled', selectedIds.length >= 3 && !sel);
  });
  document.getElementById('selectionCount').textContent = `${selectedIds.length}/3개 선택됨`;
  const btn = document.getElementById('compareBtn');
  btn.disabled = selectedIds.length === 0;
  btn.onclick = () => { if (selectedIds.length > 0) window.location.href = `/compare.html?ids=${selectedIds.join(',')}&profile=${profile}`; };
}
window.toggleSelect = toggleSelect;

// ── 비교 결과 ──
async function loadComparison(ids) {
  showScreen('Loading');
  try {
    const res = await fetch(`${API_BASE}/compare-products?ids=${ids}&profile=${profile}`);
    if (!res.ok) { showError('API 오류: ' + res.status); return; }
    const data = await res.json();
    if (data.error) { showError(data.message || '비교 데이터를 불러올 수 없습니다.'); return; }
    renderComparison(data);
    showScreen('Compare');
  } catch (err) { showError('오류: ' + (err.message||'')); }
}

function renderComparison(data) {
  try {
    const valid = data.products.filter(p => !p.error);
    const winners = data.winners || {};
    const cols = valid.length;
    if (!cols) { showError('비교할 수 있는 제품이 없습니다.'); return; }

    document.getElementById('compareTitle').textContent = `${cols}개 제품 비교`;
    document.getElementById('compareMeta').textContent = `${data.profile.label} 기준`;
    document.getElementById('changeBtn').onclick = () => window.location.href = `/compare.html?mode=select&profile=${data.profile.id}`;
    renderProfileTabs(data.profile.id);

    const gridCols = `80px repeat(${cols}, 1fr)`;
    let html = '';

    // ── 1. 제품 카드 ──
    html += `<div class="product-cards cols-${cols}">`;
    valid.forEach((p, idx) => {
      const rank = idx + 1;
      const rankLabel = ['1위 추천','2위','3위'][idx] || `${rank}위`;
      const ks = p.keySpec || {};
      const scores = p.detailScores || {};
      const scoreItems = [
        { label:'함량', val: safeNum(scores.dose) },
        { label:'제형', val: safeNum(scores.form) },
        { label:'원료', val: safeNum(scores.source) },
        { label:'인증', val: safeNum(scores.cert) },
        { label:'가격', val: safeNum(scores.price) },
      ];
      const imageHtml = p.image
        ? `<img class="product-card-img" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'">`
        : `<div class="product-card-img-fallback">${PILL_SVG}</div>`;

      const costGood  = ks.dailyCost && ks.dailyCost === Math.min(...valid.map(v=>v.keySpec.dailyCost||9999));
      const costWarn  = ks.dailyCost && ks.dailyCost === Math.max(...valid.map(v=>v.keySpec.dailyCost||0)) && cols > 1;
      const doseWarn  = ks.dailyMg   && ks.dailyMg   === Math.min(...valid.map(v=>v.keySpec.dailyMg||9999)) && cols > 1;

      const tierTag = ks.tier ? `<span class="pc-tag${ks.tier==='Tier1'?' hi':''}">${escapeHtml(ks.tier)}</span>` : '';
      const certTag = ks.certs ? `<span class="pc-tag">${escapeHtml(String(ks.certs).split(',')[0].trim())}</span>` : '';

      html += `
        <div class="product-card rank-${rank}">
          <span class="product-card-badge">${rankLabel}</span>
          ${imageHtml}
          <div class="product-card-name">${escapeHtml(p.name)}</div>
          <div class="product-card-score">${p.vScore||0}</div>
          <div class="product-card-score-lbl">V-SCORE</div>
          <hr class="product-card-divider">
          <div class="product-card-row">
            <span class="product-card-row-lbl">EPA+DHA</span>
            <span class="product-card-row-val${doseWarn?' warn':''}">${ks.dailyMg?(ks.dailyMg.toLocaleString()+'mg'):'-'}</span>
          </div>
          <div class="product-card-row">
            <span class="product-card-row-lbl">1일 비용</span>
            <span class="product-card-row-val${costGood?' good':costWarn?' warn':''}">${ks.dailyCost?(ks.dailyCost.toLocaleString()+'원'):'-'}</span>
          </div>
          <div class="product-card-row">
            <span class="product-card-row-lbl">제형</span>
            <span class="product-card-row-val">${escapeHtml(ks.form||'-')}</span>
          </div>
          <div class="product-card-tags">${tierTag}${certTag}</div>
          <div class="pc-bars">
            ${scoreItems.map(s=>`
              <div class="pc-bar-row">
                <span class="pc-bar-lbl">${s.label}</span>
                <div class="pc-bar-track"><div class="pc-bar-fill ${barColor(s.val)}" style="width:${s.val}%"></div></div>
                <span class="pc-bar-num">${s.val}</span>
              </div>`).join('')}
          </div>
        </div>`;
    });
    html += '</div>';

    // ── 2. 상세 비교 테이블 ──
    html += `<div class="section-label">상세 비교</div>`;
    html += `<div class="cmp-table">`;
    html += `<div class="cmp-table-head">`;
    html += `<div class="cmp-table-hcell">항목</div>`;
    valid.forEach((p,i) => html += `<div class="cmp-table-hcell">${escapeHtml(p.name.length>8?p.name.slice(0,8)+'…':p.name)}</div>`);
    html += '</div>';

    const rows = [
      { label:'EPA+DHA', vals: valid.map(p=>p.keySpec.dailyMg?p.keySpec.dailyMg.toLocaleString()+'mg':'-'), winIds: winners.dose||[] },
      { label:'1일 비용', vals: valid.map(p=>p.keySpec.dailyCost?p.keySpec.dailyCost.toLocaleString()+'원':'-'), winIds: winners.price||[] },
      { label:'1일 캡슐', vals: valid.map(p=>p.keySpec.dailyCapsules?p.keySpec.dailyCapsules+'캡슐':'-') },
      { label:'캡슐 크기', vals: valid.map(p=>p.keySpec.capsuleMg?p.keySpec.capsuleMg.toLocaleString()+'mg':'-') },
      { label:'제형',     vals: valid.map(p=>p.keySpec.form||'-') },
      { label:'원료사',   vals: valid.map(p=>p.keySpec.supplier||'-') },
      { label:'인증',     vals: valid.map(p=>p.keySpec.certs||'-'), winIds: winners.cert||[] },
      { label:'리뷰 수',  vals: valid.map(p=>p.keySpec.reviews?p.keySpec.reviews.toLocaleString():'-'), winIds: winners.reviews||[] },
      { label:'Tier',     vals: valid.map(p=>p.tier||'-') },
    ];
    rows.forEach(row => {
      html += `<div class="cmp-table-row">`;
      html += `<div class="cmp-table-cell">${row.label}</div>`;
      valid.forEach((p,i) => {
        const isBest = row.winIds && row.winIds.includes(p.id) && row.winIds.length < cols;
        html += `<div class="cmp-table-cell${isBest?' best':''}">${escapeHtml(row.vals[i])}</div>`;
      });
      html += '</div>';
    });
    html += '</div>';

    // ── 3. 인사이트 ──
    const insightSVGs = {
      trophy: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4H5a2 2 0 0 0-2 2v3c0 2.21 1.79 4 4 4h.01M17 4h2a2 2 0 0 1 2 2v3c0 2.21-1.79 4-4 4H17M7 4h10v8a5 5 0 0 1-10 0V4z"/></svg>',
      coin:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1"/><path d="M12 7v1m0 8v1"/></svg>',
      pill:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l8-8a4.95 4.95 0 0 1 7 7l-8 8a4.95 4.95 0 0 1-7-7z"/><path d="M8.5 8.5l7 7"/></svg>',
      badge:  '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
      chat:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      tie:    '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 7-2 1-2-1 2-7zM10 10l-4 10 6-4 6 4-4-10"/></svg>',
    };

    const insights = [];
    if (winners.total?.length === 1) {
      const p = valid.find(x=>x.id===winners.total[0]);
      if (p) insights.push({ svg: insightSVGs.trophy, text: `<strong>종합 1위</strong>: ${escapeHtml(p.name)} (${p.vScore}점)` });
    } else if (winners.total?.length > 1) {
      insights.push({ svg: insightSVGs.tie, text: `<strong>종합 점수 동률</strong>: ${winners.total.length}개 제품이 같은 점수` });
    }
    if (winners.price?.length === 1) {
      const p = valid.find(x=>x.id===winners.price[0]);
      if (p) insights.push({ svg: insightSVGs.coin, text: `<strong>가성비 1위</strong>: ${escapeHtml(p.name)} (1일 ${p.keySpec.dailyCost}원)` });
    }
    if (winners.dose?.length === 1) {
      const p = valid.find(x=>x.id===winners.dose[0]);
      if (p) insights.push({ svg: insightSVGs.pill, text: `<strong>고함량 1위</strong>: ${escapeHtml(p.name)} (1일 ${p.keySpec.dailyMg}mg)` });
    } else if (winners.dose?.length === cols) {
      insights.push({ svg: insightSVGs.tie, text: `<strong>함량 동급</strong>: 모든 제품이 1일 ${valid[0].keySpec.dailyMg}mg` });
    }
    if (winners.cert?.length === 1) {
      const p = valid.find(x=>x.id===winners.cert[0]);
      if (p && p.detailScores.cert>0) insights.push({ svg: insightSVGs.badge, text: `<strong>인증 1위</strong>: ${escapeHtml(p.name)} (${escapeHtml(p.keySpec.certs)})` });
    }
    if (winners.reviews?.length === 1) {
      const p = valid.find(x=>x.id===winners.reviews[0]);
      if (p && p.keySpec.reviews>0) insights.push({ svg: insightSVGs.chat, text: `<strong>리뷰 1위</strong>: ${escapeHtml(p.name)} (${p.keySpec.reviews.toLocaleString()}개)` });
    }

    if (insights.length) {
      html += `<div class="insights">
        <div class="insights-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          한눈에 보기
        </div>
        ${insights.map(i=>`
          <div class="insight-item">
            <div class="insight-icon">${i.svg}</div>
            <span class="insight-text">${i.text}</span>
          </div>`).join('')}
      </div>`;
    }

    // ── 4. CTA ──
    html += '<div class="compare-actions">';
    valid.forEach((p, idx) => {
      if (p.coupangLink) {
        html += `<a class="compare-action-link" href="${escapeHtml(p.coupangLink)}" target="_blank" rel="noopener">
          <div class="compare-action-link-left">
            <span class="compare-action-link-name">${idx+1}위 · ${escapeHtml(p.name)}</span>
            <span class="compare-action-link-label">쿠팡에서 보기</span>
          </div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </a>`;
      } else {
        html += `<div class="compare-action-link disabled">
          <div class="compare-action-link-left">
            <span class="compare-action-link-name">${idx+1}위 · ${escapeHtml(p.name)}</span>
            <span class="compare-action-link-label">링크 없음</span>
          </div>
        </div>`;
      }
    });
    html += '</div>';

    document.getElementById('compareContent').innerHTML = html;
    document.getElementById('compareDisclaimer').textContent = data.disclaimer || '';

  } catch(err) {
    showError('렌더링 오류: ' + (err.message||''));
  }
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + name).classList.add('active');
  window.scrollTo(0, 0);
}
function showError(msg) {
  document.getElementById('compareContent').innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
  showScreen('Compare');
}
</script>
</body>
</html>
