  <style>
    :root {
      --green-deep: #1B3A2E; --green-primary: #2D5F3F; --green-mid: #4A7C5A;
      --green-light: #E8F1EA; --green-bg: #F5F9F6;
      --paper: #FAF8F3; --ink: #1A1F1B; --ink-soft: #4F564E;
      --ink-faint: #8B928A; --line: #D9DDD7; --line-soft: #ECEFEA;
      --gold: #B8902F; --silver: #8B8E91; --bronze: #B07142; --warn: #C9533D;
      --shadow-sm: 0 1px 2px rgba(27, 58, 46, 0.06);
      --shadow-md: 0 4px 12px rgba(27, 58, 46, 0.08);
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper); color: var(--ink);
      font-size: 17px; line-height: 1.5; letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); box-shadow: 0 0 40px rgba(27, 58, 46, 0.05); }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
      background: var(--paper); position: sticky; top: 0; z-index: 10;
    }
    .header-back { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); border-radius: var(--radius-sm); text-decoration: none; }
    .header-back:hover { background: var(--green-light); }
    .header-back svg { width: 22px; height: 22px; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--green-deep); }
    .header-action { font-size: 14px; color: var(--green-primary); cursor: pointer; padding: 6px 10px; border-radius: 6px; transition: background 0.15s ease; font-weight: 600; text-decoration: none; }
    .header-action:hover { background: var(--green-light); }
    /* ── 공유 버튼 ── */
    .header-share { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); background: none; border: none; border-radius: 8px; padding: 0; }
    .header-share:active { transform: scale(0.92); }
    .header-share svg { width: 21px; height: 21px; }
    .share-toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--green-deep); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 100px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
    .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .loading-screen { text-align: center; padding: 60px 20px; }
    .loading-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--green-primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; color: var(--ink-soft); }

    .query-header {

    }
    .query-header::before { content: ''; position: absolute; top: -40%; right: -10%; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%); }
    .query-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.7; margin-bottom: 6px; text-transform: uppercase; }
    .query-text { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.45; margin-bottom: 6px; }
    .query-meta { font-size: 13px; opacity: 0.75; }
    .alert { padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 15px; line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
    .alert-warn { background: rgba(201, 83, 61, 0.06); border: 1px solid rgba(201, 83, 61, 0.2); color: var(--warn); }
    .alert-icon { flex-shrink: 0; font-size: 18px; line-height: 1.3; }

    /* 추천 제품: 답변이 끝난 뒤 부드럽게 등장 */
    .products-reveal { opacity: 0; transform: translateY(8px); transition: opacity .38s ease, transform .38s ease; }
    .products-reveal.in { opacity: 1; transform: translateY(0); }

    .recommend-title { font-size: 16px; font-weight: 700; color: var(--green-deep); letter-spacing: -0.01em; }

    .product-card-row { display: flex; gap: 10px; align-items: flex-start; }

    .rank-3 .product-image-fallback { background: linear-gradient(135deg, #F5DDC8 0%, #DAB494 100%); }
    .product-rank-badge { position: absolute; top: -6px; left: -6px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: white; background: var(--green-mid); box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 2; }
    .rank-1 .product-rank-badge { background: var(--gold); }
    .rank-2 .product-rank-badge { background: var(--silver); }
    .rank-3 .product-rank-badge { background: var(--bronze); }
    .product-info { flex: 1; min-width: 0; }
    .product-info-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 5px; }
    .product-rank-pill { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em; flex-shrink: 0; background: var(--green-mid); color: white; }
    .rank-1 .product-rank-pill { background: var(--gold); color: white; }
    .rank-2 .product-rank-pill { background: var(--silver); color: white; }
    .rank-3 .product-rank-pill { background: var(--bronze); color: white; }
    .product-vscore-block { text-align: right; flex-shrink: 0; }
    .product-vscore-num { font-size: 21px; font-weight: 800; color: var(--green-deep); line-height: 1; letter-spacing: -0.04em; }
    .product-vscore-cap { font-size: 11px; font-weight: 600; color: var(--ink-faint); letter-spacing: 0.06em; margin-top: 1px; }
    .product-name { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 6px; }
    .product-meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
    .product-tags { display: flex; flex-wrap: wrap; gap: 3px; }
    .product-tag { font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 100px; background: var(--green-light); color: var(--green-deep); }
    .product-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .btn-mini { padding: 7px 8px; border: none; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: -0.01em; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; }
    .btn-mini.secondary { background: var(--green-light); color: var(--green-deep); }
    .btn-mini.primary { background: var(--green-primary); color: white; }
    .btn-mini.primary:hover { background: var(--green-deep); }
    .btn-mini:disabled { background: var(--line); color: var(--ink-faint); cursor: not-allowed; }

    /* ── 자세히 보기: 통계 막대 그래프 (app.html H안 이식) ── */
    .detail-panel { display: none; margin-top: 8px; padding-top: 2px; }
    .detail-panel.active { display: block; animation: fadeIn 0.3s ease; }
    .stat-bar { padding: 12px 0; border-top: 0.5px solid var(--line-soft); }
    .stat-bar:first-child { border-top: none; padding-top: 6px; }
    .stat-bar-line { font-size: 15px; color: var(--ink); line-height: 1.4; margin-bottom: 6px; }
    .stat-bar-line .title { font-weight: 700; }

    .stat-bar-graph { position: relative; height: 30px; }

    .stat-bar-fill { position: absolute; top: 8px; left: 0; height: 4px; background: var(--green-primary); border-radius: 2px; }
    .stat-bar-dot { position: absolute; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--green-primary); border: 3px solid white; outline: 1.5px solid var(--green-primary); transform: translateX(-50%); z-index: 3; }
    .stat-bar-endpoint { position: absolute; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: white; border: 2px solid var(--ink-faint); transform: translateX(-50%); z-index: 1; }
    .stat-bar-endpoint.left { left: 0; }
    .stat-bar-endpoint.right { left: 100%; }

    .stat-bar-avg-label { position: absolute; top: 18px; transform: translateX(-50%); font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
    .stat-bar-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-faint); margin-top: -2px; }
    .q-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--green-light); color: var(--green-primary); font-size: 10px; font-weight: 700; cursor: pointer; flex-shrink: 0; margin-left: 4px; vertical-align: middle; border: none; font-family: inherit; }
    .q-icon:hover { background: var(--green-mid); color: white; }

    /* ── 용어 하단 시트 ── */
    .term-sheet-overlay { position: fixed; inset: 0; background: rgba(27,58,46,0.35); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .term-sheet-overlay.active { opacity: 1; pointer-events: auto; }
    .term-sheet { position: fixed; left: 50%; transform: translateX(-50%) translateY(100%); bottom: 0; width: 100%; max-width: 480px; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.15); z-index: 101; transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); padding: 10px 22px max(22px, env(safe-area-inset-bottom)); }
    .term-sheet.active { transform: translateX(-50%) translateY(0); }
    .term-sheet-handle { width: 38px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 16px; cursor: pointer; }
    .term-sheet-title { font-size: 18px; font-weight: 800; color: var(--green-deep); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .term-sheet-badge { font-size: 11px; background: var(--green-light); color: var(--green-primary); padding: 3px 9px; border-radius: 100px; font-weight: 700; }
    .term-sheet-body { font-size: 14px; line-height: 1.7; color: var(--ink-soft); }
    .term-sheet-points { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
    .term-sheet-point { font-size: 13px; color: var(--green-primary); font-weight: 600; display: flex; gap: 6px; align-items: flex-start; }
    .term-sheet-close { width: 100%; margin-top: 18px; padding: 13px; background: var(--green-light); color: var(--green-deep); border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .term-sheet-close:hover { background: #DCE9DF; }

    /* ── 더 보기 버튼 ── */
    .more-btn { width: 100%; margin: 2px 0 10px; padding: 12px; background: white; border: 1.5px solid var(--green-primary); border-radius: var(--radius-sm); color: var(--green-primary); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: -0.01em; transition: background 0.15s ease; }
    .more-btn:hover { background: var(--green-light); }
    .more-btn:active { transform: scale(0.98); }

    .compare-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
    .compare-cta-btn { padding: 11px; border: 1.5px solid var(--green-primary); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: -0.01em; text-decoration: none; text-align: center; background: white; color: var(--green-primary); }
    .compare-cta-btn:hover { background: var(--green-light); }
    .compare-cta-btn.primary { background: var(--green-primary); color: white; }
    .compare-cta-btn.primary:hover { background: var(--green-deep); }

    .fit-cta-title { font-size: 15px; font-weight: 700; color: #27500A; margin-bottom: 4px; }
    .fit-cta-sub { font-size: 14px; color: #3B6D11; line-height: 1.6; margin-bottom: 12px; }
    .fit-cta-btn { display: block; width: 100%; background: #3B6D11; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .fit-cta-btn:hover { background: #27500A; }
    .disclaimer { margin-top: 24px; padding: 14px; font-size: 13px; color: var(--ink-faint); text-align: center; line-height: 1.6; border-top: 1px solid var(--line-soft); }
    .empty-recommendation { text-align: center; padding: 24px 16px; background: var(--green-bg); border-radius: var(--radius-md); color: var(--ink-soft); font-size: 15px; }
    .error-box { text-align: center; padding: 40px 20px; color: var(--warn); }

    /* ── 성분/제품 리스트 헤더 ── */
    .ingredient-products-head { font-size: 16px; font-weight: 700; color: var(--green-deep); margin-bottom: 12px; padding: 0 4px; letter-spacing: -0.01em; }

    /* ── 고객 피드백 ── */
    @keyframes fbFade { from { opacity: 0; } to { opacity: 1; } }
    .feedback { margin-top: 16px; padding: 0 8px; }
    .feedback-trigger {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      width: 100%; padding: 13px;
      background: white; border: 1.5px solid var(--green-primary);
      border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14px; font-weight: 700;
      color: var(--green-primary); cursor: pointer;
      transition: background 0.15s ease;
    }
    .feedback-trigger:hover { background: var(--green-light); }
    .feedback-trigger:active { transform: scale(0.98); }
    .feedback-trigger svg { width: 16px; height: 16px; flex-shrink: 0; }

    .feedback-modal {
      display: none; position: fixed; top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 200;
      background: var(--paper); flex-direction: column;
    }
    .feedback-modal.active { display: flex; animation: fbFade 0.2s ease; }
    .feedback-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 18px 16px;
      border-bottom: 1px solid var(--line-soft); background: var(--paper);
    }
    .feedback-modal-title { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700; color: var(--green-deep); }
    .feedback-modal-title svg { width: 18px; height: 18px; color: var(--green-primary); flex-shrink: 0; }
    .feedback-modal-close { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--ink-faint); cursor: pointer; border-radius: 8px; }
    .feedback-modal-close:hover { background: var(--line-soft); }
    .feedback-modal-close svg { width: 20px; height: 20px; }
    .feedback-modal-body { flex: 1; display: flex; flex-direction: column; padding: 18px; overflow-y: auto; }
    .feedback-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; }
    .feedback-textarea {
      flex: 1; width: 100%; min-height: 200px; resize: none;
      padding: 14px; background: white;
      border: 1.5px solid var(--line); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 15px; color: var(--ink); line-height: 1.6;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .feedback-textarea::placeholder { color: var(--ink-faint); }
    .feedback-textarea:focus { outline: none; border-color: var(--green-primary); box-shadow: 0 0 0 3px rgba(45,95,63,0.08); }
    .feedback-err { font-size: 13px; color: var(--warn); margin-top: 10px; }
    .feedback-modal-foot {
      display: flex; gap: 8px;
      padding: 14px 18px max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line-soft); background: var(--paper);
    }
    .feedback-btn {
      flex: 1; padding: 14px; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.15s ease;
    }
    .feedback-btn.cancel { background: var(--green-light); color: var(--green-deep); }
    .feedback-btn.cancel:hover { background: #DCE9DF; }
    .feedback-btn.send { background: var(--green-primary); color: white; }
    .feedback-btn.send:hover { background: var(--green-deep); }
    .feedback-btn:disabled { background: var(--line); color: var(--ink-faint); cursor: not-allowed; }
    .feedback-done {
      display: none; position: fixed; top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 201;
      background: var(--paper); flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 40px; text-align: center;

  </style>

<script>
const API_BASE = window.location.origin;

function shareIngredi(){
  var url = location.origin + location.pathname;
  var data = { title: 'ingredi', text: 'AI가 상담하고 추천하는, 광고 없는 건강기능식품 비교 · ingredi', url: url };
  if (navigator.share) { navigator.share(data).catch(function(){}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(function(){ showShareToast('링크가 복사되었어요'); })
      .catch(function(){ window.prompt('아래 링크를 복사하세요', url); });
  } else { window.prompt('아래 링크를 복사하세요', url); }
}
window.shareIngredi = shareIngredi;
function showShareToast(msg){
  var t = document.getElementById('shareToast');
  if (!t) { t = document.createElement('div'); t.id = 'shareToast'; t.className = 'share-toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(t._shareTimer);
  t._shareTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
window.showShareToast = showShareToast;
const params = new URLSearchParams(window.location.search);
const query = params.get('q') || '';
let distributions = null;

// 카운슬링 카테고리(영문 키) → app.html 딥링크용 한글 카테고리
const CAT_KO = { omega3: "오메가3", vitaminC: "비타민C", eye: "눈", probiotics: "마이크로바이옴" };
let CURRENT_CAT_KO = "오메가3";

// 백버튼 표준: 같은 사이트에서 왔으면 진짜 직전 화면, 직접 진입이면 폴백
function smartBack(fallback) {
  try {
    const ref = document.referrer;
    if (history.length > 1 && ref && new URL(ref).origin === location.origin) {
      history.back();
      return;
    }
  } catch (e) {}
  location.href = fallback || '/app.html';
}
window.smartBack = smartBack;

// 비오메가3 카테고리 → 추천/비교 딥링크용 (app.html / compare.html 은 한글 카테고리 키 사용)
const CATEGORY_PARAM = { omega3: '오메가3', vitaminC: '비타민C', eye: '눈', probiotics: '마이크로바이옴' };
const CATEGORY_LABEL = { omega3: '오메가3', vitaminC: '비타민C', eye: '눈 건강', probiotics: '유산균' };

if (!query) { window.location.href = '/app.html'; }
else { loadConsultation(query); }

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 답변 텍스트 렌더링 — * 항목은 불릿으로, 나머지 마크다운은 제거
function renderAnswerText(str) {
  if (!str) return '';
  let cleaned = str
    .replace(/^#{1,4}\s*/gm, '')
    .replace(/\*\*([^*\n]+)\*\*/g, '$1')
    .replace(/__([^_\n]+)__/g, '$1')
    .replace(/^[-]{3,}\s*$/gm, '')
    .replace(/^>\s*/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  const lines = cleaned.split('\n');
  let html = '';
  let inList = false;

  for (const line of lines) {
    const bulletMatch = line.match(/^[*\-•]\s+(.+)/);
    if (bulletMatch) {
      if (!inList) {
        html += '<ul style="margin:8px 0 8px 4px;padding:0;list-style:none;">';
        inList = true;
      }
      html += `<li style="display:flex;gap:8px;margin-bottom:7px;line-height:1.7;">` +
              `<span style="color:var(--green-primary);font-weight:700;flex-shrink:0;margin-top:1px;">•</span>` +
              `<span>${escapeHtml(bulletMatch[1])}</span></li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (line.trim() === '') {
        html += '<br>';
      } else {
        html += `<p style="margin:0 0 8px;">${escapeHtml(line)}</p>`;
      }
    }
  }
  if (inList) html += '</ul>';
  return html;
}

function safeNum(v, fb = 0) { const n = Number(v); return isNaN(n) ? fb : n; }
function firstOf(v) {
  if (v == null) return '';
  if (Array.isArray(v)) return v[0] || '';
  if (typeof v === 'string') return v.split(',')[0].trim();
  return String(v);
}

// ── 용어 설명 데이터 (막대 ? 시트) ──
const TERM_INFO = {
  "epadha": { title: "EPA+DHA 함량", badge: "핵심 지표",
    body: "오메가3의 핵심 성분이에요. EPA는 혈행·염증 개선, DHA는 뇌·눈 건강에 도움을 줍니다. 하루 권장량은 보통 500~2,000mg이에요.",
    points: ["막대에서 이 제품의 위치와 평균을 비교해보세요"] },
  "cost": { title: "1일 복용 비용", badge: "가격 지표",
    body: "하루에 권장량을 섭취하는 데 드는 비용이에요. 제품 가격 ÷ 복용 일수로 계산해요. 낮을수록 가성비가 좋아요.",
    points: ["평균보다 왼쪽에 있으면 저렴한 편이에요"] },
  "capsule": { title: "캡슐 크기 (목넘김)", badge: "복용 편의",
    body: "캡슐 1알의 무게예요. 작을수록 삼키기 편해요. 고함량이면서 작은 캡슐이 가장 좋아요.",
    points: ["평균보다 왼쪽이면 비교적 작은 캡슐이에요"] }
};

function openTermSheet(key) {
  const info = TERM_INFO[key];
  if (!info) return;
  document.getElementById("termSheetTitle").innerHTML =
    escapeHtml(info.title) + (info.badge ? ` <span class="term-sheet-badge">${escapeHtml(info.badge)}</span>` : "");
  document.getElementById("termSheetBody").textContent = info.body;
  const pointsEl = document.getElementById("termSheetPoints");
  pointsEl.innerHTML = (info.points || []).map(p => `<div class="term-sheet-point">✓ ${escapeHtml(p)}</div>`).join("");
  document.getElementById("termSheetOverlay").classList.add("active");
  document.getElementById("termSheet").classList.add("active");
}
window.openTermSheet = openTermSheet;

function closeTermSheet() {
  document.getElementById("termSheetOverlay").classList.remove("active");
  document.getElementById("termSheet").classList.remove("active");
}
window.closeTermSheet = closeTermSheet;

// ── 통계 막대 ──
function calcPos(value, min, max) {
  if (!value || max === min) return null;
  return Math.max(0, Math.min(100, Math.round((value - min) / (max - min) * 100)));
}
function fmtNumber(v) { return Number(v).toLocaleString(); }

function renderStatBar(opts) {
  const { title, value, min, max, avg, unit } = opts;
  if (!value || min === max) return '';
  const pos = calcPos(value, min, max);
  if (pos == null) return '';
  const avgPos = calcPos(avg, min, max);
  const minLabel = opts.minLabel || '최소';
  const maxLabel = opts.maxLabel || '최대';
  const avgHtml = (avg > 0 && avgPos != null)
    ? `<div class="stat-bar-avg-dot" style="left:${avgPos}%"></div><div class="stat-bar-avg-label" style="left:${avgPos}%">평균 ${fmtNumber(avg)}${unit}</div>`
    : '';
  return `
    <div class="stat-bar">
      <div class="stat-bar-line">
        <span class="title">${title}</span><span class="value">${fmtNumber(value)}${unit}</span>${opts.termKey ? `<button class="q-icon" onclick="openTermSheet('${opts.termKey}')">?</button>` : ''}
      </div>
      <div class="stat-bar-graph">
        <div class="stat-bar-track"></div>
        <div class="stat-bar-fill" style="width:${pos}%"></div>
        <div class="stat-bar-endpoint left"></div>
        <div class="stat-bar-endpoint right"></div>
        ${avgHtml}
        <div class="stat-bar-dot" style="left:${pos}%"></div>
      </div>
      <div class="stat-bar-ends">
        <span>${minLabel} ${fmtNumber(min)}${unit}</span>
        <span>${maxLabel} ${fmtNumber(max)}${unit}</span>
      </div>
    </div>`;
}

function renderStatBars(ks) {
  const d = distributions || {};
  let html = '';
  if (d.dose && safeNum(ks.dailyMg) > 0) {
    html += renderStatBar({ title: 'EPA+DHA 함량', termKey: 'epadha', value: safeNum(ks.dailyMg), min: d.dose.min, max: d.dose.max, avg: d.dose.avg, unit: 'mg' });
  }
  if (d.cost && safeNum(ks.dailyCost) > 0) {
    html += renderStatBar({ title: '1일 복용 비용', termKey: 'cost', value: safeNum(ks.dailyCost), min: d.cost.min, max: d.cost.max, avg: d.cost.avg, unit: '원', minLabel: '최저', maxLabel: '최고' });
  }
  if (d.capsule && safeNum(ks.capsuleMg) > 0) {
    html += renderStatBar({ title: '캡슐 크기 (목넘김)', termKey: 'capsule', value: safeNum(ks.capsuleMg), min: d.capsule.min, max: d.capsule.max, avg: d.capsule.avg, unit: 'mg' });
  }
  return html || '<div style="font-size:13px;color:var(--ink-faint);padding:8px 0;">표시할 상세 지표가 없어요.</div>';
}

/* ── 검색·질문 로깅 (Phase 2) ──
   consult.html은 app.html 입력·예시칩·딥링크의 모든 자유질의가 통과하는 지점이라,
   여기 한 곳에서 로깅하면 검색어·질문이 중복 없이 100% 기록됩니다.
   정상 응답이면 카테고리·결과수까지, 실패해도 질의만이라도 폴백 기록합니다. */
let _searchLogged = false;
function _catKoOf(c) {
  if (CAT_KO[c]) return CAT_KO[c];
  if (c === 'out_of_scope') return '범위밖';
  return c || '미상';
}
function _resultCountOf(d) {
  if (!d) return null;
  if (d.mode === 'ingredient' || d.mode === 'product') return (d.ingredientProducts || []).length;
  if (d.recommendation && Array.isArray(d.recommendation.top3)) return d.recommendation.top3.length;
  return null;
}
function _sendSearchLog(type, content, category, resultCount) {
  if (!content) return;
  try {
    fetch('/log-search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: type, content: content, category: category, resultCount: resultCount }),
      keepalive: true
    }).catch(function () {});
  } catch (e) {}
}
function logSearchFromData(d) {
  if (_searchLogged || !query) return;
  _searchLogged = true;
  const type = (d && d.mode === 'product') ? '검색' : '질문';
  _sendSearchLog(type, query, _catKoOf(d && d.category), _resultCountOf(d));
}
function logSearchFallback() {
  if (_searchLogged || !query) return;
  _searchLogged = true;
  _sendSearchLog('질문', query, '미상', null);
}

async function loadConsultation(q) {
  document.getElementById('queryText').textContent = q;
  let metaData = null;
  try {
    const res = await fetch(`${API_BASE}/counsel-api?q=${encodeURIComponent(q)}`);
    const ct = res.headers.get('content-type') || '';
    if (ct.indexOf('text/event-stream') === -1) {
      // JSON (에러 / out_of_scope 등)
      const data = await res.json();
      if (data.error) { logSearchFromData(data); showError(data.message || '답변을 불러올 수 없습니다.'); return; }
      CURRENT_CAT_KO = CAT_KO[data.category] || "오메가3";
      renderResult(data);
      if (data.answer) setAnswerText(data.answer);
      logSearchFromData(data);
      showResultScreen();
      return;
    }
    // SSE 스트리밍: 답변을 먼저 다 보여준 뒤 → 추천 제품을 노출
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", answerRaw = "", shown = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf("\n\n")) !== -1) {
        const chunk = buf.slice(0, sep); buf = buf.slice(sep + 2);
        const ev = parseSSE(chunk);
        if (!ev) continue;
        if (ev.event === 'meta') {
          metaData = ev.data;
          CURRENT_CAT_KO = CAT_KO[ev.data.category] || "오메가3";
          renderResult(ev.data, true);   // 제품은 아직 그리지 않음
          logSearchFromData(ev.data);
          if (!shown) { showResultScreen(); shown = true; }
        } else if (ev.event === 'token') {
          answerRaw += (ev.data.text || "");
          setAnswerText(answerRaw);
        }
      }
    }
    if (!shown) showResultScreen();
    revealProducts(metaData);          // 답변 완료 후 제품 노출
  } catch (err) {
    // 메타를 이미 받았다면(스트림 중간 끊김) 에러 대신 제품이라도 보여준다
    if (metaData) { revealProducts(metaData); return; }
    logSearchFallback();
    showError('네트워크 오류가 발생했어요.');
  }
}
function showResultScreen(){
  document.getElementById('screenLoading').classList.remove('active');
  document.getElementById('screenResult').classList.add('active');
}
function parseSSE(chunk){
  let event = 'message', data = '';
  chunk.split("\n").forEach(function(line){
    if (line.indexOf('event:') === 0) event = line.slice(6).trim();
    else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
  });
  if (!data) return null;
  try { return { event: event, data: JSON.parse(data) }; } catch(_) { return null; }
}
function setAnswerText(raw){
  const sec = document.getElementById('answerSection');
  const el = document.getElementById('answerText');
  if (!el) return;
  if (sec) sec.style.display = '';
  el.innerHTML = renderAnswerText(raw);
}

function renderMedicalAlertFromFlags(flags) {
  const alertBox = document.getElementById('medicalAlert');
  if (flags && flags.requiresMedicalConsult) {
    const riskMap = { pregnancy: '임산부·수유부', surgery: '수술 관련', bleeding: '출혈 위험', highDose: '고함량', chronicDisease: '만성질환', smoking: '흡연·베타카로틴', immunocompromised: '면역저하·중증질환', vitcRisk: '신장결석·철 과부하', antibiotics: '항생제 병용' };
    const risks = (flags.detectedRisks || []).map(r => riskMap[r] || r).join(', ');
    alertBox.innerHTML = `
      <div class="alert alert-warn">
        <span class="alert-icon">⚠</span>
        <div><strong>의사·약사 상담을 권장합니다</strong><br>${escapeHtml(risks)} 관련 키워드가 감지되었어요. 복용 전 전문가와 상담하세요.</div>
      </div>`;
  } else { alertBox.innerHTML = ''; }
}

// 제품 카드 — '자세히 보기' = 통계 막대 인라인 펼침
function productCardHtml(p) {
  const ks = p.keySpec || {};
  const tags = [
    ks.tier ? `<span class="product-tag">${escapeHtml(ks.tier)}</span>` : '',

// 성분/제품 모드 제품 리스트: 10개 먼저 + 더 보기로 전체 펼침
function renderProductListMode(data) {
  const products = data.ingredientProducts || [];
  const recEl = document.getElementById('recommendContent');
  if (products.length === 0) {
    recEl.innerHTML = `<div class="empty-recommendation">관련 제품을 찾지 못했어요.</div>`;
    return;
  }
  const profileId = (data.recommendation && data.recommendation.profile && data.recommendation.profile.id) || 'balanced';
  const term = data.ingredientTerm || data.query || '';
  const headText = data.mode === 'product'
    ? `'${escapeHtml(term)}' 검색 결과`
    : `${escapeHtml(term)} 관련 제품 ${products.length}개`;

  const INITIAL = 10;
  const visible = products.slice(0, INITIAL);
  const hidden = products.slice(INITIAL);
  const visibleHtml = visible.map(productCardHtml).join('');
  const hiddenHtml = hidden.length
    ? `<div id="moreProducts" style="display:none">${hidden.map(productCardHtml).join('')}</div>` +
      `<button id="moreProductsBtn" class="more-btn" onclick="showMoreProducts()">추천 제품 더 보기 (+${hidden.length})</button>`
    : '';
  const ids = products.slice(0, 3).map(p => p.id).join(',');

  recEl.innerHTML = `
    <section class="recommend-section">
      <div class="ingredient-products-head">${headText}</div>
      ${visibleHtml}
      ${hiddenHtml}
      <div class="compare-cta">
        <a class="compare-cta-btn primary" href="/compare.html?category=${encodeURIComponent(CURRENT_CAT_KO)}&ids=${ids}&profile=${profileId}">상위 비교</a>
        <a class="compare-cta-btn" href="/compare.html?category=${encodeURIComponent(CURRENT_CAT_KO)}&mode=select&profile=${profileId}">직접 선택</a>
      </div>
    </section>`;
}

// 카운슬 모드 제품 추천 (Top 3) — 없으면 카테고리 추천/비교 CTA
function renderCounselProducts(data) {
  const recEl = document.getElementById('recommendContent');
  const rec = data.recommendation;
  if (rec && rec.top3 && rec.top3.length > 0) {
    const top3Html = rec.top3.map(productCardHtml).join('');
    const top3Ids = rec.top3.map(p => p.id).join(',');
    recEl.innerHTML = `
      <section class="recommend-section">
        <div class="recommend-header">
          <div>
            <div class="recommend-title">관련 제품 추천</div>
            <div class="recommend-subtitle">${rec.totalCount}개 중 ${rec.filteredCount}개 분석</div>
          </div>
          <span class="profile-tag">${escapeHtml(rec.profile.label)}</span>
        </div>
        ${top3Html}
        <div class="compare-cta">
          <a class="compare-cta-btn primary" href="/compare.html?ids=${top3Ids}&profile=${rec.profile.id}">Top 3 비교</a>
          <a class="compare-cta-btn" href="/compare.html?mode=select&profile=${rec.profile.id}">직접 선택</a>
        </div>
      </section>`;
    return;
  }
  // top3 없음 → 카테고리 전체 보기/비교 CTA (눈·비타민C·유산균 등)
  const catParam = CATEGORY_PARAM[data.category];
  if (catParam) {
    const label = CATEGORY_LABEL[data.category] || catParam;
    recEl.innerHTML = `
      <section class="recommend-section">
        <div class="recommend-header">
          <div>
            <div class="recommend-title">${escapeHtml(label)} 제품 보기</div>
            <div class="recommend-subtitle">ingredi가 제품 데이터로 비교해드려요</div>
          </div>
        </div>
        <div class="compare-cta">
          <a class="compare-cta-btn primary" href="/app.html?category=${encodeURIComponent(catParam)}">추천 제품 보기</a>
          <a class="compare-cta-btn" href="/compare.html?category=${encodeURIComponent(catParam)}">제품 비교하기</a>
        </div>
      </section>`;
  } else {
    recEl.innerHTML = '';
  }
}

function renderResult(data, deferProducts) {
  if (data.distributions) distributions = data.distributions;

  const kCount = data.flags ? data.flags.knowledgeCount || 0 : 0;
  const fCount = data.flags ? data.flags.faqCount || 0 : 0;
  document.getElementById('queryMeta').textContent =
    data.mode === 'product' ? '제품 검색 결과'
    : data.category === 'out_of_scope' ? '지원하지 않는 카테고리'
    : `관련 정보 ${kCount + fCount}건 검색`;

  renderMedicalAlertFromFlags(data.flags);

  // AI 답변 셸 (텍스트는 스트리밍 토큰으로 채움 / 제품 모드는 토큰이 없어 숨김 유지)
  const answerEl = document.getElementById('answerContent');
  answerEl.innerHTML = `
    <article class="answer-section" id="answerSection" style="display:none">
      <div class="answer-eyebrow"><span class="answer-eyebrow-dot"></span>AI 답변</div>
      <div class="answer-text" id="answerText"></div>
    </article>`;

  // 제품 영역 — deferProducts면 답변 스트리밍이 끝난 뒤에 그린다
  if (deferProducts) {
    const recEl = document.getElementById('recommendContent');
    if (recEl) recEl.innerHTML = '';
  } else {
    renderProducts(data);
  }

  document.getElementById('disclaimer').textContent = data.disclaimer || '';
}

// 제품 카드 렌더 (모드 분기) — 단독 호출 가능하도록 분리
function renderProducts(data) {
  if (data.mode === 'ingredient' || data.mode === 'product') {
    renderProductListMode(data);
  } else {
    renderCounselProducts(data);
  }
}

// 답변이 끝난 뒤 제품 리스트를 부드럽게 등장시킨다
let _productsShown = false;
function revealProducts(data) {
  if (_productsShown || !data) return;
  _productsShown = true;
  const recEl = document.getElementById('recommendContent');
  renderProducts(data);
  if (recEl) {
    recEl.classList.add('products-reveal');
    requestAnimationFrame(function () { recEl.classList.add('in'); });
  }
}

function showError(msg) {
  document.getElementById('answerContent').innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
  document.getElementById('screenLoading').classList.remove('active');
  document.getElementById('screenResult').classList.add('active');
}

/* ── 고객 피드백 ── */
const FB_SCREEN = { home: "home", category: "category", consult: "consult" };
function fbLock(on){ document.body.style.overflow = on ? "hidden" : ""; }
function fbOpen(id){
  const modal = document.getElementById("fbForm-" + id);
  const ta = document.getElementById("fbText-" + id);
  if (modal) modal.classList.add("active");
  fbLock(true);
  if (ta) ta.focus();
}
function fbCancel(id){
  const modal = document.getElementById("fbForm-" + id);
  const ta = document.getElementById("fbText-" + id);
  const err = document.getElementById("fbErr-" + id);
  if (modal) modal.classList.remove("active");
  if (ta) ta.value = "";
  if (err) err.textContent = "";
  fbLock(false);
}
async function fbSubmit(id){
  const ta = document.getElementById("fbText-" + id);
  const err = document.getElementById("fbErr-" + id);
  const btn = document.getElementById("fbSend-" + id);
  const content = ((ta && ta.value) || "").trim();
  if (err) err.textContent = "";
  if (!content){ if (ta) ta.focus(); return; }
  if (btn){ btn.disabled = true; btn.textContent = "보내는 중…"; }
  const payload = { 내용: content, 화면: FB_SCREEN[id] || id };
  if (id === "category" && typeof activeCat === "string" && activeCat) payload.카테고리 = activeCat;
  try {
    const res = await fetch("/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    let data = {};
    try { data = await res.json(); } catch (_e) {}
    if (!res.ok || !data.ok) throw new Error((data && data.error) || "전송 실패");
    const modal = document.getElementById("fbForm-" + id);
    const done = document.getElementById("fbDone-" + id);
    if (modal) modal.classList.remove("active");
    if (done) done.classList.add("active");
    if (ta) ta.value = "";
    if (btn){ btn.disabled = false; btn.textContent = "보내기"; }
    setTimeout(function(){ if (done) done.classList.remove("active"); fbLock(false); }, 1800);
  } catch (e) {
    if (err) err.textContent = "전송에 실패했어요. 잠시 후 다시 시도해주세요.";
    if (btn){ btn.disabled = false; btn.textContent = "보내기"; }
  }
}
window.fbOpen = fbOpen;
window.fbCancel = fbCancel;
window.fbSubmit = fbSubmit;

/* ── Clarity: "구매하러 가기" 클릭 이벤트 (이벤트 위임) ── */
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('a.btn-mini.primary');
  if (!el) return;
  if (typeof window.clarity !== 'function') return;
  try {
    window.clarity('event', 'purchase_click');
    if (CURRENT_CAT_KO) window.clarity('set', 'category', CURRENT_CAT_KO);
    var card = el.closest('.product-card');
    var nm = card && card.querySelector('.product-name');
    if (nm) window.clarity('set', 'product', nm.textContent.trim().slice(0, 60));
  } catch (_) {}
});
