<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ingredi · AI 카운슬링</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --green-deep: #1B3A2E; --green-primary: #2D5F3F; --green-mid: #4A7C5A;
      --green-light: #E8F1EA; --green-bg: #F5F9F6;
      --paper: #FAF8F3; --ink: #1A1F1B; --ink-soft: #4F564E;
      --ink-faint: #8B928A; --line: #D9DDD7; --line-soft: #ECEFEA;
      --gold: #B8902F; --silver: #8B8E91; --bronze: #B07142; --warn: #C9533D;
      --shadow-sm: 0 1px 2px rgba(27, 58, 46, 0.06);
      --shadow-md: 0 4px 12px rgba(27, 58, 46, 0.08);
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper); color: var(--ink);
      font-size: 17px; line-height: 1.5; letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); box-shadow: 0 0 40px rgba(27, 58, 46, 0.05); }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
      background: var(--paper); position: sticky; top: 0; z-index: 10;
    }
    .header-back { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); border-radius: var(--radius-sm); text-decoration: none; }
    .header-back:hover { background: var(--green-light); }
    .header-back svg { width: 22px; height: 22px; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--green-deep); }
    .header-action { font-size: 14px; color: var(--green-primary); cursor: pointer; padding: 6px 10px; border-radius: 6px; transition: background 0.15s ease; font-weight: 600; text-decoration: none; }
    .header-action:hover { background: var(--green-light); }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .loading-screen { text-align: center; padding: 60px 20px; }
    .loading-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--green-primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; color: var(--ink-soft); }
    .loading-detail { font-size: 13px; color: var(--ink-faint); margin-top: 6px; }
    .query-header {
      background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-primary) 100%);
      color: white; padding: 18px 20px 22px;
      margin: -20px -20px 20px; position: relative; overflow: hidden;
    }
    .query-header::before { content: ''; position: absolute; top: -40%; right: -10%; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%); }
    .query-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.7; margin-bottom: 6px; text-transform: uppercase; }
    .query-text { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.45; margin-bottom: 6px; }
    .query-meta { font-size: 13px; opacity: 0.75; }
    .alert { padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 15px; line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
    .alert-warn { background: rgba(201, 83, 61, 0.06); border: 1px solid rgba(201, 83, 61, 0.2); color: var(--warn); }
    .alert-icon { flex-shrink: 0; font-size: 18px; line-height: 1.3; }
    .answer-section { background: white; border: 1px solid var(--line-soft); border-radius: var(--radius-md); padding: 18px 18px 14px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
    .answer-eyebrow { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--green-primary); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
    .answer-eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-primary); animation: pulse 2s ease infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .answer-text { font-size: 16px; line-height: 1.8; color: var(--ink); letter-spacing: -0.01em; }
    .recommend-section { margin-top: 4px; }
    .recommend-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; padding: 0 4px; }
    .recommend-title { font-size: 16px; font-weight: 700; color: var(--green-deep); letter-spacing: -0.01em; }
    .recommend-subtitle { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
    .profile-tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 100px; background: var(--green-light); color: var(--green-deep); letter-spacing: -0.01em; }
    .product-card { background: white; border: 1px solid var(--line-soft); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow-sm); transition: box-shadow 0.2s ease; }
    .product-card:hover { box-shadow: var(--shadow-md); }
    .product-card.rank-1 { border: 1.5px solid var(--gold); background: linear-gradient(180deg, #FEFAF1 0%, white 60%); }
    .product-card.rank-2 { border: 1.5px solid var(--silver); }
    .product-card.rank-3 { border: 1.5px solid var(--bronze); }
    .product-card-row { display: flex; gap: 10px; align-items: flex-start; }
    .product-image-wrap { width: 76px; flex-shrink: 0; position: relative; }
    .product-image { width: 76px; height: 96px; object-fit: cover; border-radius: 6px; background: var(--green-bg); display: block; }
    .product-image-fallback { width: 76px; height: 96px; border-radius: 6px; background: linear-gradient(135deg, #FFF8E5 0%, #F5E6B8 100%); }
    .rank-2 .product-image-fallback { background: linear-gradient(135deg, #E5E8EB 0%, #C4C8CC 100%); }
    .rank-3 .product-image-fallback { background: linear-gradient(135deg, #F5DDC8 0%, #DAB494 100%); }
    .product-rank-badge { position: absolute; top: -6px; left: -6px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 2; }
    .rank-1 .product-rank-badge { background: var(--gold); }
    .rank-2 .product-rank-badge { background: var(--silver); }
    .rank-3 .product-rank-badge { background: var(--bronze); }
    .product-info { flex: 1; min-width: 0; }
    .product-info-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 5px; }
    .product-rank-pill { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em; flex-shrink: 0; }
    .rank-1 .product-rank-pill { background: var(--gold); color: white; }
    .rank-2 .product-rank-pill { background: var(--silver); color: white; }
    .rank-3 .product-rank-pill { background: var(--bronze); color: white; }
    .product-vscore-block { text-align: right; flex-shrink: 0; }
    .product-vscore-num { font-size: 21px; font-weight: 800; color: var(--green-deep); line-height: 1; letter-spacing: -0.04em; }
    .product-vscore-cap { font-size: 11px; font-weight: 600; color: var(--ink-faint); letter-spacing: 0.06em; margin-top: 1px; }
    .product-name { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 6px; }
    .product-meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
    .product-tags { display: flex; flex-wrap: wrap; gap: 3px; }
    .product-tag { font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 100px; background: var(--green-light); color: var(--green-deep); }
    .product-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .btn-mini { padding: 7px 8px; border: none; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: -0.01em; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; }
    .btn-mini.secondary { background: var(--green-light); color: var(--green-deep); }
    .btn-mini.primary { background: var(--green-primary); color: white; }
    .btn-mini.primary:hover { background: var(--green-deep); }
    .btn-mini:disabled { background: var(--line); color: var(--ink-faint); cursor: not-allowed; }
    .compare-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
    .compare-cta-btn { padding: 11px; border: 1.5px solid var(--green-primary); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: -0.01em; text-decoration: none; text-align: center; background: white; color: var(--green-primary); }
    .compare-cta-btn:hover { background: var(--green-light); }
    .compare-cta-btn.primary { background: var(--green-primary); color: white; }
    .compare-cta-btn.primary:hover { background: var(--green-deep); }
    .fit-cta { background: #EAF3DE; border: 1px solid #97C459; border-radius: 12px; padding: 16px; text-align: center; margin-top: 16px; }
    .fit-cta-title { font-size: 15px; font-weight: 700; color: #27500A; margin-bottom: 4px; }
    .fit-cta-sub { font-size: 14px; color: #3B6D11; line-height: 1.6; margin-bottom: 12px; }
    .fit-cta-btn { display: block; width: 100%; background: #3B6D11; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .fit-cta-btn:hover { background: #27500A; }
    .disclaimer { margin-top: 24px; padding: 14px; font-size: 13px; color: var(--ink-faint); text-align: center; line-height: 1.6; border-top: 1px solid var(--line-soft); }
    .empty-recommendation { text-align: center; padding: 24px 16px; background: var(--green-bg); border-radius: var(--radius-md); color: var(--ink-soft); font-size: 15px; }
    .error-box { text-align: center; padding: 40px 20px; color: var(--warn); }

    /* ── 성분 설명 카드 (#2a) ── */
    .ingredient-card { background: white; border: 1px solid var(--line-soft); border-radius: var(--radius-md); padding: 18px; margin-bottom: 22px; box-shadow: var(--shadow-sm); }
    .ingredient-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .ingredient-term { font-size: 22px; font-weight: 800; color: var(--green-deep); letter-spacing: -0.02em; }
    .ingredient-badge { font-size: 12px; font-weight: 700; background: var(--green-light); color: var(--green-primary); padding: 3px 10px; border-radius: 100px; }
    .ingredient-def { font-size: 16px; line-height: 1.75; color: var(--ink); letter-spacing: -0.01em; }
    .ingredient-points { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
    .ingredient-point { font-size: 14px; color: var(--green-primary); font-weight: 600; display: flex; gap: 6px; align-items: flex-start; }
    .ingredient-evidence { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-faint); }
    .ingredient-products-head { font-size: 16px; font-weight: 700; color: var(--green-deep); margin-bottom: 12px; padding: 0 4px; letter-spacing: -0.01em; }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <a class="header-back" href="/app.html" aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <div class="header-title">AI 카운슬링</div>
    <a class="header-action" href="/app.html">새 질문</a>
  </header>

  <div class="screen loading-screen active" id="screenLoading">
    <div class="loading-spinner"></div>
    <div class="loading-text">답변을 준비하고 있습니다…</div>
    <div class="loading-detail">잠시만 기다려주세요 (5~10초)</div>
  </div>

  <main class="screen" id="screenResult">
    <div class="query-header">
      <div class="query-eyebrow">INGREDI 카운슬링</div>
      <div class="query-text" id="queryText">질문 내용</div>
      <div class="query-meta" id="queryMeta">분석 결과</div>
    </div>
    <div id="medicalAlert"></div>
    <div id="answerContent"></div>
    <div id="recommendContent"></div>
    <div class="disclaimer" id="disclaimer"></div>
    <div class="fit-cta">
      <div class="fit-cta-title">여러 영양제를 같이 드시나요?</div>
      <div class="fit-cta-sub">지금 드시는 조합에 겹침·과잉·상호작용이 없는지<br>ingredi가 무료로 점검해드려요</div>
      <a class="fit-cta-btn" href="/fit.html">내 조합 점검하기</a>
    </div>
  </main>
</div>

<script>
const API_BASE = window.location.origin;
const params = new URLSearchParams(window.location.search);
const query = params.get('q') || '';

if (!query) { window.location.href = '/app.html'; }
else { loadConsultation(query); }

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 답변 텍스트 렌더링 — * 항목은 불릿으로, 나머지 마크다운은 제거
function renderAnswerText(str) {
  if (!str) return '';

  // 1단계: 불필요한 마크다운 제거
  let cleaned = str
    .replace(/^#{1,4}\s*/gm, '')          // ### 헤더
    .replace(/\*\*([^*\n]+)\*\*/g, '$1')  // **굵게**
    .replace(/__([^_\n]+)__/g, '$1')      // __밑줄__
    .replace(/^[-]{3,}\s*$/gm, '')        // --- 구분선
    .replace(/^>\s*/gm, '')              // > 인용
    .replace(/\n{3,}/g, '\n\n')          // 3줄 이상 빈줄 축소
    .trim();

  // 2단계: "* 항목" 줄을 <li>로 변환하여 HTML 렌더링
  const lines = cleaned.split('\n');
  let html = '';
  let inList = false;

  for (const line of lines) {
    const bulletMatch = line.match(/^[*\-•]\s+(.+)/);
    if (bulletMatch) {
      if (!inList) {
        html += '<ul style="margin:8px 0 8px 4px;padding:0;list-style:none;">';
        inList = true;
      }
      html += `<li style="display:flex;gap:8px;margin-bottom:7px;line-height:1.7;">` +
              `<span style="color:var(--green-primary);font-weight:700;flex-shrink:0;margin-top:1px;">•</span>` +
              `<span>${escapeHtml(bulletMatch[1])}</span></li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (line.trim() === '') {
        html += '<br>';
      } else {
        html += `<p style="margin:0 0 8px;">${escapeHtml(line)}</p>`;
      }
    }
  }
  if (inList) html += '</ul>';
  return html;
}

function safeNum(v, fb = 0) { const n = Number(v); return isNaN(n) ? fb : n; }
function firstOf(v) {
  if (v == null) return '';
  if (Array.isArray(v)) return v[0] || '';
  if (typeof v === 'string') return v.split(',')[0].trim();
  return String(v);
}

async function loadConsultation(q) {
  document.getElementById('queryText').textContent = q;
  try {
    const res = await fetch(`${API_BASE}/counsel-api?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if (data.error) { showError(data.message || '답변을 불러올 수 없습니다.'); return; }
    renderResult(data);
    document.getElementById('screenLoading').classList.remove('active');
    document.getElementById('screenResult').classList.add('active');
  } catch (err) {
    showError('네트워크 오류가 발생했어요.');
  }
}

// 의료 주의 알림 (성분/카운슬 양쪽 공용)
function renderMedicalAlertFromFlags(flags) {
  const alertBox = document.getElementById('medicalAlert');
  if (flags && flags.requiresMedicalConsult) {
    const riskMap = { pregnancy: '임산부·수유부', surgery: '수술 관련', bleeding: '출혈 위험', highDose: '고함량', chronicDisease: '만성질환' };
    const risks = (flags.detectedRisks || []).map(r => riskMap[r] || r).join(', ');
    alertBox.innerHTML = `
      <div class="alert alert-warn">
        <span class="alert-icon">⚠</span>
        <div><strong>의사·약사 상담을 권장합니다</strong><br>${escapeHtml(risks)} 관련 키워드가 감지되었어요. 복용 전 전문가와 상담하세요.</div>
      </div>`;
  } else { alertBox.innerHTML = ''; }
}

// 제품 카드 (카운슬·성분 양쪽 공용)
function productCardHtml(p) {
  const ks = p.keySpec || {};
  const tags = [
    ks.tier ? `<span class="product-tag">${escapeHtml(ks.tier)}</span>` : '',
    ks.form ? `<span class="product-tag">${escapeHtml(ks.form)}</span>` : '',
    firstOf(ks.certs) ? `<span class="product-tag">${escapeHtml(firstOf(ks.certs))}</span>` : ''
  ].join('');
  const imageHtml = p.image
    ? `<img class="product-image" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name||'')}" onerror="this.outerHTML='<div class=\\'product-image-fallback\\'></div>'">`
    : `<div class="product-image-fallback"></div>`;
  return `
    <article class="product-card rank-${p.rank}">
      <div class="product-card-row">
        <div class="product-image-wrap">${imageHtml}<span class="product-rank-badge">${p.rank}</span></div>
        <div class="product-info">
          <div class="product-info-top">
            <span class="product-rank-pill">${p.rank}위</span>
            <div class="product-vscore-block">
              <div class="product-vscore-num">${p.vScore || 0}</div>
              <div class="product-vscore-cap">V-SCORE</div>
            </div>
          </div>
          <div class="product-name">${escapeHtml(p.name || '')}</div>
          <div class="product-meta">1일 ${safeNum(ks.dailyMg).toLocaleString()}mg · ${safeNum(ks.dailyCost).toLocaleString()}원</div>
          <div class="product-tags">${tags}</div>
        </div>
      </div>
      <div class="product-card-actions">
        ${p.coupangLink
          ? `<a class="btn-mini primary" href="${escapeHtml(p.coupangLink)}" target="_blank" rel="noopener">쿠팡에서 보기</a>`
          : `<button class="btn-mini primary" disabled>링크 없음</button>`}
        <a class="btn-mini secondary" href="/app.html">전체 추천 보기</a>
      </div>
    </article>`;
}

// 성분 모드 렌더링 (#2a)
function renderIngredientMode(data) {
  const card = data.ingredientCard;
  document.getElementById('queryMeta').textContent = `${card.term} · 성분 정보`;
  renderMedicalAlertFromFlags(data.flags);

  const pointsHtml = (card.points && card.points.length)
    ? `<div class="ingredient-points">${card.points.map(p => `<div class="ingredient-point">✓ ${escapeHtml(p)}</div>`).join('')}</div>`
    : '';
  const evidenceHtml = card.evidence
    ? `<div class="ingredient-evidence">근거 · ${escapeHtml(card.evidence)}</div>`
    : '';
  document.getElementById('answerContent').innerHTML = `
    <article class="ingredient-card">
      <div class="ingredient-card-head">
        <span class="ingredient-term">${escapeHtml(card.term)}</span>
        ${card.badge ? `<span class="ingredient-badge">${escapeHtml(card.badge)}</span>` : ''}
      </div>
      <div class="ingredient-def">${escapeHtml(card.definition || '')}</div>
      ${pointsHtml}
      ${evidenceHtml}
    </article>`;

  const products = data.ingredientProducts || [];
  const recEl = document.getElementById('recommendContent');
  if (products.length > 0) {
    const ids = products.slice(0, 3).map(p => p.id).join(',');
    const profileId = (data.recommendation && data.recommendation.profile && data.recommendation.profile.id) || 'balanced';
    recEl.innerHTML = `
      <section class="recommend-section">
        <div class="ingredient-products-head">${escapeHtml(card.term)} 관련 제품 ${products.length}개</div>
        ${products.map(productCardHtml).join('')}
        <div class="compare-cta">
          <a class="compare-cta-btn primary" href="/compare.html?ids=${ids}&profile=${profileId}">상위 비교</a>
          <a class="compare-cta-btn" href="/compare.html?mode=select&profile=${profileId}">직접 선택</a>
        </div>
      </section>`;
  } else {
    recEl.innerHTML = `<div class="empty-recommendation">관련 제품을 찾지 못했어요.</div>`;
  }

  document.getElementById('disclaimer').textContent = data.disclaimer || '';
}

function renderResult(data) {
  // 성분 모드 (#2a): 카드 + 제품 리스트로 분기
  if (data.ingredientCard) { renderIngredientMode(data); return; }

  const kCount = data.flags ? data.flags.knowledgeCount || 0 : 0;
  const fCount = data.flags ? data.flags.faqCount || 0 : 0;
  document.getElementById('queryMeta').textContent =
    data.category === 'out_of_scope' ? '지원하지 않는 카테고리' : `관련 정보 ${kCount + fCount}건 검색`;

  renderMedicalAlertFromFlags(data.flags);

  // 답변 — 근거 출처 없음, 마크다운 제거
  const answerEl = document.getElementById('answerContent');
  if (data.answer) {
    answerEl.innerHTML = `
      <article class="answer-section">
        <div class="answer-eyebrow"><span class="answer-eyebrow-dot"></span>AI 답변</div>
        <div class="answer-text">${renderAnswerText(data.answer)}</div>
      </article>`;
  } else { answerEl.innerHTML = ''; }

  const recEl = document.getElementById('recommendContent');
  if (data.recommendation && data.recommendation.top3 && data.recommendation.top3.length > 0) {
    const rec = data.recommendation;
    const top3Html = rec.top3.map(productCardHtml).join('');
    const top3Ids = rec.top3.map(p => p.id).join(',');
    recEl.innerHTML = `
      <section class="recommend-section">
        <div class="recommend-header">
          <div>
            <div class="recommend-title">관련 제품 추천</div>
            <div class="recommend-subtitle">${rec.totalCount}개 중 ${rec.filteredCount}개 분석</div>
          </div>
          <span class="profile-tag">${escapeHtml(rec.profile.label)}</span>
        </div>
        ${top3Html}
        <div class="compare-cta">
          <a class="compare-cta-btn primary" href="/compare.html?ids=${top3Ids}&profile=${rec.profile.id}">Top 3 비교</a>
          <a class="compare-cta-btn" href="/compare.html?mode=select&profile=${rec.profile.id}">직접 선택</a>
        </div>
      </section>`;
  } else if (data.category !== 'out_of_scope') {
    recEl.innerHTML = `<div class="empty-recommendation">추천할 제품이 없어요. 다른 키워드로 검색해보세요.</div>`;
  } else { recEl.innerHTML = ''; }

  document.getElementById('disclaimer').textContent = data.disclaimer || '';
}

function showError(msg) {
  document.getElementById('answerContent').innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
  document.getElementById('screenLoading').classList.remove('active');
  document.getElementById('screenResult').classList.add('active');
}
</script>
</body>
</html>
