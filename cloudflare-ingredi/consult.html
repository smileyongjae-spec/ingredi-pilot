  <style>
    :root {
      /* 화자 디자인 헌장: 한지 배경, 비대칭 배색(그린은 긍정에만), 먹색 타이포 */
      --paper: #FAF8F3; --paper-dim: #F1EDE3;
      --ink: #24231F; --ink-soft: #4A4740; --ink-faint: #8A8578;
      --line: #DAD5C7; --line-strong: #B8B2A2;
      --green-deep: #1B3A2E; --green-primary: #2D5F3F; --green-tint: #EDF3EE; --green-light: #E8F1EA;
      --font-voice: 'Noto Serif KR', 'Pretendard', serif;
      --font-ui: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: var(--font-ui);
      background: var(--paper); color: var(--ink);
      font-size: 17px; line-height: 1.5; letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); box-shadow: 0 0 40px rgba(27,58,46,0.05); display: flex; flex-direction: column; }
    /* ── 헤더 ── */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 0.5px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 10; }
    .header-back { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); border-radius: 8px; text-decoration: none; }
    .header-back svg { width: 22px; height: 22px; }
    .header-title { font-size: 17px; font-weight: 700; color: var(--green-deep); letter-spacing: 0.02em; }
    .header-action { font-size: 14px; color: var(--green-primary); cursor: pointer; padding: 6px 10px; border-radius: 6px; font-weight: 600; text-decoration: none; background: none; border: none; font-family: inherit; }
    .header-share { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); background: none; border: none; border-radius: 8px; padding: 0; }
    .header-share:active { transform: scale(0.92); }
    .header-share svg { width: 20px; height: 20px; }
    .share-toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--green-deep); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 100px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
    .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── 스레드 ── */
    .thread { flex: 1; padding: 22px 20px 8px; display: flex; flex-direction: column; gap: 22px; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .turn { animation: riseIn .3s ease; }
    .turn-user { align-self: flex-end; max-width: 82%; font-size: 14px; color: var(--ink-soft); background: var(--paper-dim); border-radius: 12px 12px 3px 12px; padding: 10px 13px; line-height: 1.55; white-space: pre-wrap; }
    .turn-assistant { align-self: stretch; }
    .eyebrow { font-size: 11px; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 10px; }

    /* 화자의 말 */
    .verdict { font-family: var(--font-voice); font-size: 21px; line-height: 1.5; font-weight: 500; margin-bottom: 12px; color: var(--ink); }
    .verdict.tone-positive { color: var(--green-primary); }
    .voice { font-family: var(--font-voice); font-size: 15px; line-height: 1.85; color: var(--ink-soft); white-space: pre-wrap; }
    .voice .num { font-family: var(--font-ui); font-weight: 500; color: var(--green-deep); }

    /* 되묻기(Q) */
    .clarify-q { font-family: var(--font-voice); font-size: 19px; line-height: 1.6; color: var(--ink); margin-bottom: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .chip { font-family: var(--font-ui); font-size: 14px; padding: 9px 16px; border-radius: 999px; border: 0.5px solid var(--line-strong); background: #fff; color: var(--ink); cursor: pointer; transition: all .15s ease; }
    .chip:hover { border-color: var(--green-primary); color: var(--green-primary); }
    .chip:active { transform: scale(0.97); }
    .chip.dim { color: var(--ink-faint); }
    .chip:disabled { opacity: 0.45; cursor: default; transform: none; }
    .default-answer { border-top: 0.5px solid var(--line); margin-top: 22px; padding-top: 18px; }
    .block-label { font-size: 11px; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 10px; }

    /* 경고(W) — 색이 아니라 괘선과 격식으로 */
    .warning-block { border: 0.5px solid var(--line-strong); padding: 12px 14px; margin-top: 18px; }
    .warning-block .block-label { margin-bottom: 6px; }
    .warning-text { font-size: 13px; line-height: 1.7; color: var(--ink-soft); }

    /* 의료 전환(M) */
    .handoff-block { border-top: 0.5px solid var(--line); margin-top: 18px; padding-top: 14px; }
    .handoff-text { font-size: 13.5px; line-height: 1.7; color: var(--ink-soft); }

    /* 대안 카드 — 부정 평결의 출구 (그린은 여기에만) */
    .alts { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .alt-card { background: #fff; border: 0.5px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-decoration: none; }
    .alt-card:active { transform: scale(0.99); }
    .alt-info { min-width: 0; }
    .alt-name { font-size: 14px; color: var(--ink); font-weight: 500; }
    .alt-reason { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
    .alt-badge { font-size: 12px; color: var(--green-primary); border: 0.5px solid var(--green-primary); border-radius: 999px; padding: 3px 10px; flex-shrink: 0; white-space: nowrap; }
    .alt-cta { margin-top: 10px; }

    /* 후속 행동 버튼 */
    .followups { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .fu-btn { font-family: var(--font-ui); font-size: 13px; padding: 8px 14px; border-radius: 8px; border: 0.5px solid var(--line-strong); background: transparent; color: var(--ink-soft); cursor: pointer; }
    .fu-btn:hover { border-color: var(--green-primary); color: var(--green-primary); }
    .fu-btn:disabled { opacity: 0.45; cursor: default; }
    .fu-link { font-family: var(--font-ui); font-size: 13px; padding: 8px 14px; border-radius: 8px; border: 0.5px solid var(--green-primary); color: var(--green-primary); text-decoration: none; display: inline-block; }

    /* 로딩(생각 중) */
    .thinking { display: flex; align-items: center; gap: 10px; color: var(--ink-faint); font-family: var(--font-voice); font-size: 14px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); animation: blink 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* ── 입력창 ── */
    .composer { position: sticky; bottom: 0; background: linear-gradient(180deg, rgba(250,248,243,0) 0%, var(--paper) 24%); padding: 18px 16px calc(14px + env(safe-area-inset-bottom)); }
    .composer-inner { display: flex; gap: 8px; align-items: flex-end; background: #fff; border: 0.5px solid var(--line-strong); border-radius: 16px; padding: 8px 8px 8px 16px; }
    .composer-inner:focus-within { border-color: var(--green-primary); }
    .composer textarea { flex: 1; border: none; outline: none; resize: none; font-family: var(--font-ui); font-size: 15px; line-height: 1.5; color: var(--ink); background: transparent; max-height: 96px; padding: 6px 0; }
    .composer textarea::placeholder { color: var(--ink-faint); }
    .send-btn { width: 38px; height: 38px; border-radius: 12px; border: none; background: var(--green-primary); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:disabled { background: var(--line); cursor: default; }
    .send-btn svg { width: 18px; height: 18px; }
    .composer-note { text-align: center; font-size: 11px; color: var(--ink-faint); margin-top: 8px; line-height: 1.5; }

    /* ── 첫 화면 (인사) ── */
    .intro { padding-top: 8px; }
    .intro-voice { font-family: var(--font-voice); font-size: 20px; line-height: 1.65; color: var(--ink); margin-bottom: 6px; }
    .intro-sub { font-family: var(--font-voice); font-size: 14px; line-height: 1.8; color: var(--ink-soft); margin-bottom: 18px; }

    /* ── 피드백 (기존 이식) ── */
    @keyframes fbFade { from { opacity: 0; } to { opacity: 1; } }
    .feedback-modal { display: none; position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 200; background: var(--paper); flex-direction: column; }
    .feedback-modal.active { display: flex; animation: fbFade 0.2s ease; }
    .feedback-modal-head { display: flex; align-items: center; justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 18px 16px; border-bottom: 0.5px solid var(--line); background: var(--paper); }
    .feedback-modal-title { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700; color: var(--green-deep); }
    .feedback-modal-title svg { width: 18px; height: 18px; color: var(--green-primary); flex-shrink: 0; }
    .feedback-modal-close { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--ink-faint); cursor: pointer; border-radius: 8px; }
    .feedback-modal-close svg { width: 20px; height: 20px; }
    .feedback-modal-body { flex: 1; display: flex; flex-direction: column; padding: 18px; overflow-y: auto; }
    .feedback-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; }
    .feedback-textarea { flex: 1; width: 100%; min-height: 200px; resize: none; padding: 14px; background: white; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 15px; color: var(--ink); line-height: 1.6; }
    .feedback-textarea:focus { outline: none; border-color: var(--green-primary); }
    .feedback-err { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
    .feedback-modal-foot { display: flex; gap: 8px; padding: 14px 18px max(14px, env(safe-area-inset-bottom)); border-top: 0.5px solid var(--line); background: var(--paper); }
    .feedback-btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
    .feedback-btn.cancel { background: var(--green-light); color: var(--green-deep); }
    .feedback-btn.send { background: var(--green-primary); color: white; }
    .feedback-btn:disabled { background: var(--line); color: var(--ink-faint); cursor: not-allowed; }
    .feedback-done { display: none; position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 201; background: var(--paper); flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px; text-align: center; }
    .feedback-done.active { display: flex; animation: fbFade 0.2s ease; }
    .feedback-done-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--green-light); display: flex; align-items: center; justify-content: center; }
    .feedback-done-icon svg { width: 30px; height: 30px; color: var(--green-primary); }
    .feedback-done-text { font-size: 16px; font-weight: 600; color: var(--green-deep); line-height: 1.6; }
    .thread-footer { padding: 4px 20px 10px; }
    .footer-links { display: flex; gap: 8px; }
    .footer-link { flex: 1; text-align: center; font-size: 13px; padding: 11px; border: 0.5px solid var(--line-strong); border-radius: 10px; color: var(--ink-soft); text-decoration: none; background: transparent; cursor: pointer; font-family: inherit; }
    .footer-note { text-align: center; font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--line); }
  </style>
</head>

<script>
/* ═══════════ 상태 ═══════════ */
var API = window.location.origin + '/counsel2';
var messages = [];          // [{role, content}]
var busy = false;
var searchLogged = false;
var lastCategory = null;    // meta.category (한글) — 딥링크용

var CAT_APP_PARAM = { '오메가3': '오메가3', '눈': '눈', '유산균': '마이크로바이옴', '비타민C': '비타민C' };

/* ═══════════ 유틸 ═══════════ */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// 화자 발화 렌더: 숫자·단위를 고딕으로 살짝 세운다 (목업의 이중 서체 리듬)
function voiceHtml(s) {
  var t = esc(s);
  t = t.replace(/(\d[\d,\.]*\s?(?:mg|g|억|만|원|%|IU|CFU|개|알|정|캡슐)|상위\s?\d+%|하위\s?\d+%|\d+위)/g, '<span class="num">$1</span>');
  return t;
}
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function scrollToBottom() {
  requestAnimationFrame(function () { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); });
}
function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 96) + 'px'; }
window.autoGrow = autoGrow;

function smartBack(fallback) {
  try {
    var ref = document.referrer;
    if (history.length > 1 && ref && new URL(ref).origin === location.origin) { history.back(); return; }
  } catch (e) {}
  location.href = fallback || '/app.html';
}
window.smartBack = smartBack;

function shareIngredi(){
  var url = location.origin + location.pathname;
  var data = { title: 'ingredi', text: 'AI가 상담하고 추천하는, 광고 없는 건강기능식품 비교 · ingredi', url: url };
  if (navigator.share) { navigator.share(data).catch(function(){}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function(){ showShareToast('링크가 복사되었어요'); }).catch(function(){ window.prompt('아래 링크를 복사하세요', url); });
  } else { window.prompt('아래 링크를 복사하세요', url); }
}
window.shareIngredi = shareIngredi;
function showShareToast(msg){
  var t = document.getElementById('shareToast');
  if (!t) { t = document.createElement('div'); t.id = 'shareToast'; t.className = 'share-toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(t._shareTimer);
  t._shareTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
window.showShareToast = showShareToast;

/* ═══════════ 검색로그 (첫 질문만) ═══════════ */
function logFirstQuery(q, category) {
  if (searchLogged || !q) return;
  searchLogged = true;
  try {
    fetch('/log-search', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: '질문', content: q, category: category || '미상', resultCount: null }),
      keepalive: true
    }).catch(function(){});
  } catch (e) {}
}

/* ═══════════ 스레드 렌더 ═══════════ */
function addUserTurn(text) {
  var thread = document.getElementById('thread');
  thread.appendChild(el('div', 'turn turn-user', esc(text)));
  scrollToBottom();
}

function addThinking() {
  var thread = document.getElementById('thread');
  var t = el('div', 'turn turn-assistant', '<div class="thinking"><span class="dots"><span></span><span></span><span></span></span>확인하고 있어요</div>');
  t.id = 'thinking';
  thread.appendChild(t);
  scrollToBottom();
}
function removeThinking() {
  var t = document.getElementById('thinking');
  if (t) t.remove();
}

// payload → 화자 블록 렌더 (목업 3종의 시각 문법)
function addAssistantTurn(payload, meta) {
  var wrap = el('div', 'turn turn-assistant');
  var h = '';

  // 평결 (V)
  if (payload.verdict) {
    var toneCls = payload.verdict_tone === 'positive' ? ' tone-positive' : '';
    h += '<p class="verdict' + toneCls + '">' + esc(payload.verdict) + '</p>';
  }
  // 되묻기 질문 (Q)
  if (payload.policy === 'Q' && payload.question) {
    h += '<p class="clarify-q">' + esc(payload.question) + '</p>';
  }
  // 본문
  if (payload.body) {
    h += '<p class="voice">' + voiceHtml(payload.body) + '</p>';
  }
  // 칩 (Q의 선택지 / X의 카테고리 등)
  if (payload.chips && payload.chips.length) {
    h += '<div class="chips">';
    for (var i = 0; i < payload.chips.length; i++) {
      var label = payload.chips[i];
      var prompt = (payload.chips_prompts && payload.chips_prompts[i]) || label;
      var dim = /모르겠/.test(label) ? ' dim' : '';
      h += '<button class="chip' + dim + '" type="button" data-prompt="' + esc(prompt) + '">' + esc(label) + '</button>';
    }
    h += '</div>';
  }
  // Q의 기본 답 — "고르지 않으셔도 됩니다"
  if (payload.policy === 'Q' && payload.default_answer) {
    h += '<div class="default-answer"><div class="block-label">고르지 않으셔도 됩니다</div>' +
         '<p class="voice">' + voiceHtml(payload.default_answer) + '</p></div>';
  }
  // 대안·추천 카드 (그린은 여기에만 — 출구 표시)
  if (payload.alternatives && payload.alternatives.length) {
    if (payload.alternatives_note) {
      h += '<div class="block-label" style="margin-top:16px">' + esc(payload.alternatives_note) + '</div>';
    }
    h += '<div class="alts"' + (payload.alternatives_note ? ' style="margin-top:0"' : '') + '>';
    var ids = [];
    for (var j = 0; j < payload.alternatives.length; j++) {
      var a = payload.alternatives[j];
      ids.push(a.product_id);
      var appCat = CAT_APP_PARAM[lastCategory] || '오메가3';
      h += '<a class="alt-card" href="/app.html?category=' + encodeURIComponent(appCat) + '&focus=' + encodeURIComponent(a.product_id) + '">' +
           '<div class="alt-info"><div class="alt-name">' + esc(a.name) + '</div>' +
           (a.reason ? '<div class="alt-reason">' + esc(a.reason) + '</div>' : '') + '</div>' +
           '<span class="alt-badge">자세히 보기</span></a>';
    }
    h += '</div>';
    if (ids.length >= 2) {
      var cmpCat = CAT_APP_PARAM[lastCategory] || '오메가3';
      h += '<div class="alt-cta"><a class="fu-link" href="/compare.html?category=' + encodeURIComponent(cmpCat) + '&ids=' + esc(ids.join(',')) + '">' + ids.length + '개 비교하기 ↗</a></div>';
    }
  }
  // 경고 (W 플래그) — 괘선 + 합쇼체
  if (payload.warning) {
    h += '<div class="warning-block"><div class="block-label">확인이 필요합니다</div>' +
         '<div class="warning-text">' + esc(payload.warning) + '</div></div>';
  }
  // 의료 전환 (M)
  if (payload.policy === 'M' && payload.handoff) {
    h += '<div class="handoff-block"><div class="block-label">병원에 가시면</div>' +
         '<div class="handoff-text">' + esc(payload.handoff) + '</div></div>';
  }
  // 후속 행동 (서버 칩이 없을 때만 클라이언트 보강)
  if (!payload.chips || !payload.chips.length) {
    var fus = [];
    if (payload.verdict_tone === 'negative') fus.push({ label: '그래도 궁금해요', prompt: '그래도 이 제품이 궁금해요. 어떤 점이 아쉬운지 더 설명해줘요' });
    if (payload.verdict_tone === 'positive') fus.push({ label: '복용법 물어보기', prompt: '이 제품은 언제 어떻게 먹는 게 좋아요?' });
    if (fus.length) {
      h += '<div class="followups">';
      for (var k = 0; k < fus.length; k++) {
        h += '<button class="fu-btn" type="button" data-prompt="' + esc(fus[k].prompt) + '">' + esc(fus[k].label) + ' ↗</button>';
      }
      h += '</div>';
    }
  }

  wrap.innerHTML = h || '<p class="voice">답변을 만들지 못했어요. 다시 물어봐 주세요.</p>';
  document.getElementById('thread').appendChild(wrap);
  document.getElementById('threadFooter').style.display = '';
  scrollToBottom();
}

// 화자 톤의 오류 턴
function addErrorTurn(text) {
  var wrap = el('div', 'turn turn-assistant', '<p class="voice">' + esc(text) + '</p>');
  document.getElementById('thread').appendChild(wrap);
  scrollToBottom();
}

/* ═══════════ 대화 진행 ═══════════ */
function send(text) {
  if (busy) return;
  text = (text || '').trim();
  if (!text) return;
  busy = true;
  document.getElementById('sendBtn').disabled = true;
  disableAllChips();

  messages.push({ role: 'user', content: text });
  addUserTurn(text);
  addThinking();

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: messages })
  }).then(function (res) {
    if (res.status === 429) { throw { rateLimited: true }; }
    return res.json();
  }).then(function (out) {
    removeThinking();
    var payload = out.payload || {};
    var meta = out.meta || {};
    if (meta.category) lastCategory = meta.category;
    logFirstQuery(messages.length ? messages[0].content : text, meta.category);
    // 어시스턴트 발화를 이력에 (다음 턴 컨텍스트용 — verdict+body 요약)
    var assistantText = [payload.verdict, payload.question, payload.body, payload.default_answer].filter(Boolean).join('\n');
    messages.push({ role: 'assistant', content: assistantText.slice(0, 1200) || '(응답)' });
    addAssistantTurn(payload, meta);
  }).catch(function (e) {
    removeThinking();
    if (e && e.rateLimited) {
      addErrorTurn('질문이 너무 빨라요. 잠깐 숨 고르고 다시 물어봐 주세요.');
    } else {
      addErrorTurn('잠시 연결이 원활하지 않아요. 조금 뒤에 다시 물어봐 주세요.');
    }
    // 실패한 유저 턴은 이력에서 제거 (재전송 가능하게)
    if (messages.length && messages[messages.length - 1].role === 'user') messages.pop();
  }).finally(function () {
    busy = false;
    document.getElementById('sendBtn').disabled = false;
  });
}

function disableAllChips() {
  var btns = document.querySelectorAll('.chip, .fu-btn');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
}

function submitComposer() {
  var ta = document.getElementById('composerInput');
  var v = ta.value;
  ta.value = ''; ta.style.height = 'auto';
  send(v);
}
window.submitComposer = submitComposer;

// 칩·후속 버튼 클릭 (이벤트 위임)
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-prompt]');
  if (!b || b.disabled) return;
  send(b.getAttribute('data-prompt'));
});

// Enter 전송 (Shift+Enter 줄바꿈)
document.getElementById('composerInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submitComposer();
  }
});

function resetThread() {
  messages = [];
  lastCategory = null;
  document.getElementById('thread').innerHTML = '';
  document.getElementById('threadFooter').style.display = 'none';
  renderIntro();
}
window.resetThread = resetThread;

/* ═══════════ 첫 화면 ═══════════ */
function renderIntro() {
  var thread = document.getElementById('thread');
  var h = '<div class="turn turn-assistant intro">' +
    '<div class="eyebrow">INGREDI &nbsp;·&nbsp; 상담</div>' +
    '<p class="intro-voice">무엇이 궁금하세요?</p>' +
    '<p class="intro-sub">오메가3, 눈, 유산균, 비타민C — 네 가지를 깊게 봅니다. 제품을 골라드리기도 하고, 갖고 계신 제품이 괜찮은지 봐드리기도 해요.</p>' +
    '<div class="chips">' +
    '<button class="chip" type="button" data-prompt="회사에서 받은 오메가3가 있는데 먹어도 괜찮은지 봐주세요">갖고 있는 제품 확인</button>' +
    '<button class="chip" type="button" data-prompt="영양제를 처음 시작하려는데 뭐부터 먹어야 할까요?">뭐부터 먹어야 할까</button>' +
    '<button class="chip" type="button" data-prompt="유산균 고르는 기준이 궁금해요">고르는 기준</button>' +
    '</div></div>';
  thread.innerHTML = h;
}

/* ═══════════ 피드백 (기존 이식) ═══════════ */
function fbLock(on){ document.body.style.overflow = on ? "hidden" : ""; }
function fbOpen(id){
  var modal = document.getElementById("fbForm-" + id);
  var ta = document.getElementById("fbText-" + id);
  if (modal) modal.classList.add("active");
  fbLock(true);
  if (ta) ta.focus();
}
function fbCancel(id){
  var modal = document.getElementById("fbForm-" + id);
  var ta = document.getElementById("fbText-" + id);
  var err = document.getElementById("fbErr-" + id);
  if (modal) modal.classList.remove("active");
  if (ta) ta.value = "";
  if (err) err.textContent = "";
  fbLock(false);
}
function fbSubmit(id){
  var ta = document.getElementById("fbText-" + id);
  var err = document.getElementById("fbErr-" + id);
  var btn = document.getElementById("fbSend-" + id);
  var content = ((ta && ta.value) || "").trim();
  if (err) err.textContent = "";
  if (!content){ if (ta) ta.focus(); return; }
  if (btn){ btn.disabled = true; btn.textContent = "보내는 중…"; }
  fetch("/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 내용: content, 화면: "counsel" })
  }).then(function (res) { return res.json().catch(function(){ return {}; }).then(function(d){ return { ok: res.ok, d: d }; }); })
  .then(function (r) {
    if (!r.ok || !r.d.ok) throw new Error("전송 실패");
    var modal = document.getElementById("fbForm-" + id);
    var done = document.getElementById("fbDone-" + id);
    if (modal) modal.classList.remove("active");
    if (done) done.classList.add("active");
    if (ta) ta.value = "";
    if (btn){ btn.disabled = false; btn.textContent = "보내기"; }
    setTimeout(function(){ if (done) done.classList.remove("active"); fbLock(false); }, 1800);
  }).catch(function () {
    if (err) err.textContent = "전송에 실패했어요. 잠시 후 다시 시도해주세요.";
    if (btn){ btn.disabled = false; btn.textContent = "보내기"; }
  });
}
window.fbOpen = fbOpen;
window.fbCancel = fbCancel;
window.fbSubmit = fbSubmit;

/* ═══════════ 진입 ═══════════ */
(function init() {
  var params = new URLSearchParams(window.location.search);
  var q = (params.get('q') || '').trim();
  if (q) {
    send(q);
  } else {
    renderIntro();
  }
})();
</script>
