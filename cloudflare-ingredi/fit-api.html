<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ingredi · 내 영양제 조합 점검</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
  :root {
    --green-deep:#1B3A2E; --green-primary:#2D5F3F; --green-mid:#4A7C5A;
    --green-light:#E8F1EA; --green-bg:#F5F9F6;
    --paper:#FAF8F3; --ink:#1A1F1B; --ink-soft:#4F564E; --ink-faint:#8B928A;
    --line:#E5E2D8;
    --warn:#C2410C; --warn-bg:#FBE9E2;
    --danger:#B3261E; --danger-bg:#FBE9E7;
    --ok:#2D5F3F; --ok-bg:#E8F1EA;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6;
    max-width:480px; margin:0 auto; min-height:100vh;
  }
  .header {
    display:flex; align-items:center; gap:10px; padding:14px 18px;
    border-bottom:1px solid var(--line); background:var(--paper);
    position:sticky; top:0; z-index:10;
  }
  .header-back { font-size:22px; color:var(--ink-soft); text-decoration:none; line-height:1; }
  .header-title { font-size:16px; font-weight:700; color:var(--green-deep); }
  .wrap { padding:18px; }

  .intro { text-align:center; margin:8px 0 18px; }
  .intro-eyebrow { font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:0.05em; }
  .intro-title { font-size:19px; font-weight:700; color:var(--green-deep); margin-top:4px; }
  .intro-sub { font-size:12px; color:var(--ink-soft); margin-top:5px; }

  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card-label { font-size:13px; font-weight:600; color:var(--ink); margin-bottom:10px; }
  .card-sub { font-size:11px; color:var(--ink-soft); margin-bottom:10px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip {
    font-size:12px; padding:6px 12px; border-radius:100px;
    background:var(--green-light); color:var(--green-deep);
    border:1px solid var(--green-mid); cursor:pointer; white-space:nowrap;
  }
  .chip .x { margin-left:5px; opacity:0.6; }
  .chips:empty { display:none; }

  .input-row { display:flex; gap:8px; }
  .input-row input {
    flex:1; font-family:inherit; font-size:13px; padding:9px 11px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
  }
  .input-row input:focus { outline:none; border-color:var(--green-mid); }
  .btn-add {
    font-family:inherit; font-size:13px; font-weight:600; padding:9px 14px;
    border:1px solid var(--green-mid); border-radius:8px;
    background:#fff; color:var(--green-primary); cursor:pointer; white-space:nowrap;
  }
  .quick { font-size:11px; color:var(--ink-faint); margin-top:10px; }
  .quick b { color:var(--green-primary); cursor:pointer; font-weight:500; }
  .quick b:hover { text-decoration:underline; }

  .toggle-row { display:flex; gap:8px; }
  .toggle-btn {
    flex:1; font-family:inherit; font-size:13px; font-weight:600; padding:10px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .toggle-btn.active { border:2px solid var(--green-mid); background:var(--green-light); color:var(--green-deep); }

  .btn-submit {
    width:100%; font-family:inherit; font-size:15px; font-weight:700; padding:14px;
    border:none; border-radius:12px; background:var(--green-primary); color:#fff; cursor:pointer;
  }
  .btn-submit:disabled { background:var(--ink-faint); cursor:not-allowed; }

  .loading { text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:13px; }
  .spinner {
    width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--green-primary);
    border-radius:50%; margin:0 auto 14px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .result-combo { margin-bottom:14px; }
  .result-combo-label { font-size:11px; color:var(--ink-faint); font-weight:600; }
  .result-combo-val { font-size:14px; font-weight:700; color:var(--ink); margin-top:3px; }

  .cat {
    padding:12px 14px; margin-bottom:10px; border-radius:0 10px 10px 0;
    border-left:3px solid var(--ink-faint); background:#fff; border:1px solid var(--line); border-left-width:3px;
  }
  .cat-head { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
  .cat-msg { font-size:12px; color:var(--ink); margin-top:6px; line-height:1.6; }
  .cat.sev-high { background:var(--danger-bg); border-color:var(--danger); }
  .cat.sev-high .cat-head { color:var(--danger); }
  .cat.sev-medium { background:var(--warn-bg); border-color:var(--warn); }
  .cat.sev-medium .cat-head { color:var(--warn); }
  .cat.sev-low { background:#fff; border-color:var(--line); border-left-color:var(--ink-faint); }
  .cat.sev-low .cat-head { color:var(--ink-soft); }
  .cat.sev-none { background:var(--ok-bg); border-color:var(--ok); }
  .cat.sev-none .cat-head { color:var(--ok); }

  .disclaimer {
    background:var(--green-bg); border-radius:10px; padding:11px 13px;
    font-size:11px; color:var(--ink-soft); line-height:1.6; margin-top:6px;
  }
  .retry {
    display:block; width:100%; margin-top:14px; font-family:inherit; font-size:13px; font-weight:600;
    padding:11px; border:1px solid var(--green-mid); border-radius:10px;
    background:#fff; color:var(--green-primary); cursor:pointer; text-align:center;
  }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="header">
    <a class="header-back" href="/consult.html" aria-label="뒤로">‹</a>
    <span class="header-title">내 영양제 조합 점검</span>
  </div>

  <div class="wrap">
    <!-- 입력 화면 -->
    <div id="inputScreen">
      <div class="intro">
        <div class="intro-eyebrow">INGREDI FIT</div>
        <div class="intro-title">내 영양제 조합 점검</div>
        <div class="intro-sub">지금 드시는 걸 알려주시면<br>겹침·과잉·상호작용을 짚어드려요</div>
      </div>

      <div class="card">
        <div class="card-label">지금 드시는 영양제를 골라주세요</div>
        <div class="chips" id="chips"></div>
        <div class="input-row">
          <input type="text" id="suppInput" placeholder="영양제 이름 입력 (예: 비타민D)" autocomplete="off" />
          <button class="btn-add" id="addBtn">추가</button>
        </div>
        <div class="quick">자주 찾는 것:
          <b onclick="addSupp('오메가3')">오메가3</b> ·
          <b onclick="addSupp('종합비타민')">종합비타민</b> ·
          <b onclick="addSupp('마그네슘')">마그네슘</b> ·
          <b onclick="addSupp('유산균')">유산균</b> ·
          <b onclick="addSupp('비타민C')">비타민C</b> ·
          <b onclick="addSupp('비타민D')">비타민D</b> ·
          <b onclick="addSupp('루테인')">루테인</b> ·
          <b onclick="addSupp('아연')">아연</b>
        </div>
      </div>

      <div class="card">
        <div class="card-label">복용 중인 약이 있으신가요?</div>
        <div class="card-sub">혈압약·항응고제 등 처방약 복용 시 더 주의해서 봐드려요</div>
        <div class="toggle-row">
          <button class="toggle-btn" id="medYes" onclick="setMed(true)">예, 있어요</button>
          <button class="toggle-btn active" id="medNo" onclick="setMed(false)">아니요</button>
        </div>
      </div>

      <button class="btn-submit" id="submitBtn" onclick="analyze()">내 조합 점검받기</button>
    </div>

    <!-- 로딩 -->
    <div id="loadingScreen" class="hidden">
      <div class="loading">
        <div class="spinner"></div>
        AI가 조합을 분석하고 있어요…
      </div>
    </div>

    <!-- 결과 -->
    <div id="resultScreen" class="hidden">
      <div class="result-combo">
        <div class="result-combo-label">분석한 조합</div>
        <div class="result-combo-val" id="resultCombo"></div>
      </div>
      <div id="cats"></div>
      <div class="disclaimer" id="disclaimer"></div>
      <button class="retry" onclick="reset()">다른 조합 점검하기</button>
    </div>
  </div>

<script>
  var supplements = [];
  var takingMedication = false;

  function renderChips() {
    var c = document.getElementById('chips');
    c.innerHTML = supplements.map(function(s, i) {
      return '<span class="chip" onclick="removeSupp(' + i + ')">' + escapeHtml(s) + '<span class="x">✕</span></span>';
    }).join('');
    document.getElementById('submitBtn').disabled = supplements.length === 0;
  }
  function addSupp(name) {
    name = String(name).trim();
    if (!name) return;
    if (supplements.length >= 15) return;
    if (supplements.indexOf(name) !== -1) return;
    supplements.push(name);
    renderChips();
    document.getElementById('suppInput').value = '';
  }
  function removeSupp(i) { supplements.splice(i, 1); renderChips(); }
  function setMed(v) {
    takingMedication = v;
    document.getElementById('medYes').classList.toggle('active', v);
    document.getElementById('medNo').classList.toggle('active', !v);
  }
  document.getElementById('addBtn').onclick = function() {
    addSupp(document.getElementById('suppInput').value);
  };
  document.getElementById('suppInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addSupp(this.value); }
  });

  function show(id) {
    ['inputScreen','loadingScreen','resultScreen'].forEach(function(s) {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  function analyze() {
    if (supplements.length === 0) return;
    show('loadingScreen');
    fetch('/fit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ supplements: supplements, takingMedication: takingMedication })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) { renderResult(data); show('resultScreen'); })
    .catch(function() {
      renderResult({
        combo: supplements.join(' · '),
        categories: [{ type:'interaction', severity:'medium', title:'분석 실패',
          message:'네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.' }],
        disclaimer: '이 분석은 일반 정보이며 의료 자문이 아니에요. 약 복용 중이거나 질환이 있으면 의사·약사와 상담하세요.'
      });
      show('resultScreen');
    });
  }

  var CAT_ICON = { duplication:'⧉', excess:'▲', interaction:'⚠', synergy:'✓' };
  function renderResult(data) {
    document.getElementById('resultCombo').textContent = data.combo || supplements.join(' · ');
    var html = (data.categories || []).map(function(c) {
      var sev = c.severity || 'low';
      var icon = CAT_ICON[c.type] || '•';
      return '<div class="cat sev-' + sev + '">' +
        '<div class="cat-head">' + icon + ' ' + escapeHtml(c.title || '') + '</div>' +
        '<div class="cat-msg">' + escapeHtml(c.message || '') + '</div></div>';
    }).join('');
    document.getElementById('cats').innerHTML = html;
    document.getElementById('disclaimer').textContent = data.disclaimer || '';
  }

  function reset() {
    show('inputScreen');
    document.getElementById('suppInput').focus();
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  renderChips();
</script>
</body>
</html>
