<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1B3A2E">
<title>ingredi. — 건강기능식품 성분 비교</title>
<meta name="description" content="광고 없는 임상 근거 기반 건강기능식품 성분·가격 비교 서비스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<meta http-equiv="refresh" content="0; url=/app.html">
<script>
  // 쿼리스트링(?category=오메가3 등)을 보존하며 app.html로 즉시 이동
  location.replace('/app.html' + location.search + location.hash);
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#FAF8F3;color:#1B3A2E;
    min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{text-align:center}
  .logo{font-size:26px;font-weight:700;letter-spacing:-0.02em;color:#1B3A2E}
  .sub{font-size:13px;color:#8B8E91;margin-top:8px;font-weight:600}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2D5F3F;margin:0 3px;
    animation:b 1.2s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:0.2s}
  .dot:nth-child(3){animation-delay:0.4s}
  @keyframes b{0%,80%,100%{opacity:0.3}40%{opacity:1}}
  .dots{margin-top:16px}
  a{color:#2D5F3F;font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">ingredi.</div>
    <div class="sub">성분과 가격, 제대로 비교합니다</div>
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <noscript><p style="margin-top:16px"><a href="/app.html">서비스로 이동하기</a></p></noscript>
  </div>
</body>
</html>
